<style>
:root{
  --bg:#0a0f1f; --panel:#131a33; --panel2:#1a2245; --line:#2a3564; --text:#eef2ff; --mute:#8f9bc9;
  --lime:#c6ff3d; --court:#d97a35; --court2:#b85f24;
  --rookie:#d8c7a0; --pro:#2fd0b5; --elite:#ff5f7e; --legend:#ffd23f;
}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 600px at 70% -10%,#1b2a6b55,transparent),var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin-top:-8px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.logo b{color:var(--lime)}
.logo small{display:block;font-size:12px;letter-spacing:.3em;color:var(--mute);font-weight:500;margin-top:-4px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:700 16px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.nav button.on{color:#0a0f1f;background:var(--lime);border-color:var(--lime)}
.nav .bd{background:var(--elite);color:#fff;border-radius:999px;padding:0 7px;margin-left:6px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--mute)}
.chip b{color:var(--text)} .chip.lime b{color:var(--lime)}
.chip.mode{border-color:var(--lime);color:var(--lime);font:700 14px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase}
.btn{background:var(--lime);color:#0a0f1f;border:0;border-radius:10px;padding:12px 22px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.06em;transition:transform .12s}
.btn:hover{transform:translateY(-2px)} .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 14px;font-size:16px}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.controls{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hint{color:var(--mute);text-align:center;padding:26px 10px;font-size:17px}
.warn{color:var(--elite);font-size:14px;margin-top:8px;text-align:center}
.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.rhead h2{font-size:24px}

/* Home */
.hero{text-align:center;padding:30px 10px 10px}
.hero h1{font-size:clamp(52px,12vw,110px);font-weight:800;line-height:.9}
.hero h1 b{color:var(--lime)}
.hero p.lead{color:var(--mute);max-width:560px;margin:14px auto 26px;font-size:18px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;max-width:820px;margin:0 auto;text-align:left}
.mode{text-align:left;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-4px);border-color:var(--lime)}
.mode .ic{font-size:38px} .mode h3{font-size:30px;margin:6px 0 4px;color:var(--lime)}
.mode p{color:var(--mute);font-size:15px;line-height:1.35} .mode small{display:block;margin-top:10px;color:var(--text);font-size:13px;opacity:.85}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:26px;text-align:left}
.steps .panel h3{color:var(--lime);font-size:22px}
.steps .panel p{color:var(--mute);font-size:15px;margin-top:4px}

/* Draft */
.draft{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px}
@media(max-width:860px){.draft{grid-template-columns:1fr}}
.court{position:relative;padding:34px 12px 12px;border-radius:12px;width:fit-content;margin:0 auto;
  background:repeating-linear-gradient(90deg,var(--court) 0 46px,var(--court2) 46px 48px);
  border:3px solid #fff8;box-shadow:inset 0 0 0 3px #0002}
.court:before{content:'NET';position:absolute;top:0;left:0;right:0;height:22px;background:repeating-linear-gradient(90deg,#fff 0 6px,#111 6px 12px);
  color:#fff;font:800 12px 'Barlow Condensed';letter-spacing:.5em;text-align:center;line-height:22px;border-bottom:2px solid #fff;text-shadow:0 0 3px #000,0 0 6px #000}
.court:after{content:'';position:absolute;left:12px;right:12px;top:calc(34px + 50% - 8px);height:2px;background:#fffb}
.cgrid{display:grid;grid-template-columns:repeat(3,auto);gap:10px;position:relative;z-index:1}
.slot{--fs:9.5px;font-size:var(--fs);width:9em;height:18.4em;border:2px dashed #fffb;border-radius:.9em;background:#0003;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;color:#fff;font-family:'Barlow Condensed';text-transform:uppercase}
.slot b{font-size:2.6em;line-height:1} .slot span{font-size:1.2em;letter-spacing:.06em}
.slot.next{border-color:var(--lime);border-style:solid;color:var(--lime);background:#0006}

/* Profil */
.prof{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
.prof div{text-align:center;font:700 13px 'Barlow Condensed';letter-spacing:.08em;color:var(--mute)}
.prof b{display:block;font-size:22px;color:var(--text)}
.prof i{display:block;height:5px;border-radius:3px;background:#0006;margin-top:3px;overflow:hidden}
.prof i:after{content:'';display:block;height:100%;width:var(--w);background:var(--lime)}

/* Karten */
.card{--fs:9.5px;--c1:#5b5340;--c2:#2c2a26;--acc:var(--rookie);font-size:var(--fs);width:9em;height:18.4em;position:relative;color:#fff;overflow:hidden;
  padding:.7em .8em;border-radius:.9em .9em .9em 2.4em;border:.14em solid var(--acc);cursor:pointer;flex:none;
  background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 .5em 1.2em #0008;transition:transform .15s;text-align:left;display:flex;flex-direction:column}
.card>*{flex-shrink:0}
.card:hover{transform:translateY(-.35em) scale(1.03)}
.card.t1{--c1:#0f7368;--c2:#0a2a38;--acc:var(--pro)}
.card.t2{--c1:#b02753;--c2:#2a1030;--acc:var(--elite)}
.card.t3{--c1:#ffd23f;--c2:#7a3ff0;--acc:var(--legend);background:conic-gradient(from 200deg at 30% 20%,#ffd23f,#ff6fb5,#7a3ff0,#2fd0ff,#ffd23f);animation:holo 6s linear infinite}
.card.t3:after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,#0008,#0004 40%,#0009);pointer-events:none}
.card.t3>*{position:relative;z-index:1}
.card.fict{filter:saturate(.6)}
@keyframes holo{to{filter:hue-rotate(360deg)}}
.card .hd{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;height:6.4em}
.card .l{display:flex;flex-direction:column;align-items:flex-start;gap:.1em}
.card .ovr{font:800 3em/.9 'Barlow Condensed'}
.card .ovr sup{font-size:.4em;color:var(--lime);margin-left:.15em;vertical-align:top}
.card .pos .alt{font-size:.62em;opacity:.85}
.card.selme,.slot.selme{outline:.22em solid #fff;outline-offset:.1em;animation:selp 1s ease-in-out infinite}
@keyframes selp{50%{outline-color:var(--lime)}}
.card .pos{font:700 1.3em 'Barlow Condensed';letter-spacing:.08em;color:var(--acc)}
.card .fl{font-size:1.7em;line-height:1.1;white-space:nowrap}
.card .fl .stars{font-size:.55em;color:var(--legend);margin-left:.2em;letter-spacing:.05em}
.card .sil{width:5.2em;height:6.2em;color:var(--acc);opacity:.95;filter:drop-shadow(0 0 .25em #0008)}
.card .sil svg{width:100%;height:100%;display:block}
.card .nm{font:700 1.3em/1.1 'Barlow Condensed';text-transform:uppercase;margin-top:.2em;border-top:.1em solid #fff4;padding-top:.4em;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.25em .4em;margin-top:.5em;position:relative;z-index:1;font:600 1.05em 'Barlow Condensed'}
.card .st div{display:flex;flex-direction:column;align-items:center;background:#0005;border-radius:.4em;padding:.15em 0}
.card .st b{font-size:1.5em;line-height:1} .card .st i{font-style:normal;color:#ffffffaa;letter-spacing:.06em;font-size:.9em}
.card .tr{margin-top:auto;font:800 1em 'Barlow Condensed';letter-spacing:.3em;text-transform:uppercase;color:var(--acc);position:relative;z-index:1;text-align:center}
.card .cnt{position:absolute;top:.5em;right:.6em;background:#000a;border-radius:1em;padding:0 .6em;font:800 1.1em 'Barlow Condensed';z-index:2}
.card .lvst{position:absolute;top:.25em;left:50%;transform:translateX(-50%);z-index:4;font-size:1.05em;letter-spacing:.05em;color:#ffd23f;text-shadow:0 0 .4em #000,0 0 .5em #ffd23f88;pointer-events:none;white-space:nowrap}
.card .sheen{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;background:linear-gradient(110deg,#0000 35%,#fff6 50%,#0000 65%);background-size:250% 100%;animation:sheen 3.2s linear infinite}
@keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
.card.lv1{box-shadow:0 0 0 .2em #d5dcea,0 0 .8em #d5dcea66}
.card.lv2{box-shadow:0 0 0 .22em #ffd23f,0 0 1em #ffd23f88}
.card.lv3{box-shadow:0 0 0 .25em #ffd23f,0 0 1.3em #ffb300}
.card.lv4{box-shadow:0 0 0 .25em #4df3ff,0 0 1.6em #4df3ff;animation:neon 2s ease-in-out infinite}
@keyframes neon{50%{box-shadow:0 0 0 .25em #ff4de1,0 0 2em #ff4de1}}
.card.lv5{box-shadow:0 0 0 .28em #fff,0 0 1.8em #ffd23f;animation:rainbow 3s linear infinite}
@keyframes rainbow{to{filter:hue-rotate(360deg)}}
.card.evt,.card.evt.t3{--c1:#ff9a1f;--c2:#7c2d12;--acc:#ffe0a8;background:linear-gradient(160deg,#ffae33,#e0600f 55%,#7c2d12);box-shadow:0 0 0 .2em #ff8a00,0 0 1.2em #ff8a0099}
.card.evt:after{background:linear-gradient(120deg,#0004,#0002 40%,#0006)}
.card .evtag{position:absolute;left:0;right:0;bottom:2.6em;text-align:center;font:800 .8em 'Barlow Condensed';letter-spacing:.35em;color:#fff;background:#c2410c;padding:.1em 0;z-index:2;opacity:.9}
.hky{filter:sepia(1) saturate(4) hue-rotate(-15deg)}
.card.amore,.card.amore.t3{--c1:#222;--c2:#000;--acc:#f5d76e;background:linear-gradient(160deg,#26262c,#000 60%);box-shadow:0 0 0 .2em #f5d76e,0 0 1.6em #000,0 0 .8em #f5d76e88;color:#fff}
.card.amore:after{background:linear-gradient(120deg,#000a,#0000 45%,#000a)}
.card.amore .ovr{color:#f5d76e}
.item{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 0}
.item .ic{font-size:44px}
.item .itx{flex:1;min-width:200px}
.item h3{font-size:22px;color:var(--lime)}
.item p{color:var(--mute);font-size:14px;margin-top:2px}
.shoplist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:60vh;overflow:auto}
.srow{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.srow.evt{border-color:#ff8a00}
.srow.t3{border-color:var(--legend)}
.srow .sov{font:800 26px "Barlow Condensed",sans-serif;min-width:34px;text-align:center;color:var(--lime)}
.srow .snm{flex:1;display:flex;flex-direction:column;font:700 16px "Barlow Condensed",sans-serif;min-width:0}
.srow .snm small{font:400 12px Barlow,sans-serif;color:var(--mute)}
.srow .sdup{font-size:13px;color:var(--mute);white-space:nowrap}
.card.hero,.card.hero.t0,.card.hero.t1,.card.hero.t2,.card.hero.t3{--c1:var(--hc1);--c2:var(--hc2);--acc:#fff;background:linear-gradient(160deg,var(--hc1),var(--hc2));box-shadow:0 0 0 .2em #fff8,0 0 1.2em var(--hc1)}
.card .herotag{background:#000a;color:#fff}
.chub{display:flex;gap:22px;flex-wrap:wrap}
.ctab{flex:1;min-width:280px}
.cnx{flex:1;min-width:260px}
.ltab{width:100%;border-collapse:collapse;font-size:15px}
.ltab th{color:var(--mute);font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-align:left;padding:4px 6px}
.ltab td{padding:5px 6px;border-top:1px solid var(--line)}
.ltab tr.me td{background:#c6ff3d22;font-weight:700}
.ltab tr.up td:first-child{border-left:4px solid #4ade80}
.ltab tr.down td:first-child{border-left:4px solid #f87171}
.ltab tr.po td:first-child{border-left:4px solid #facc15}
.cnew{display:flex;gap:24px;flex-wrap:wrap}
.cnf{flex:1;min-width:280px}
.cnp{text-align:center;min-width:200px}
.cnew .lbl{display:block;margin:12px 0 6px;color:var(--mute);font:700 14px 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase}
.cnew input,.cnew select{width:100%;background:#0006;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:600 16px Barlow,sans-serif}
.swatches{display:flex;gap:10px}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.on{border-color:#fff}
.stats{display:flex;flex-direction:column;gap:6px}
.statrow{display:flex;align-items:center;gap:8px}
.statrow .sl2{width:44px;font:700 14px 'Barlow Condensed',sans-serif;color:var(--mute);letter-spacing:.08em}
.statrow .bar{flex:1;height:10px;background:#0006;border-radius:5px;overflow:hidden}
.statrow .bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,var(--lime))}
.statrow b{width:30px;text-align:right;font:700 18px 'Barlow Condensed',sans-serif}
.statrow small{width:42px;color:var(--mute);font-size:12px}
.card.bond{box-shadow:0 0 0 .22em var(--lime),0 0 1.4em var(--lime)}
.card.pickme{box-shadow:0 0 0 .2em var(--lime),0 0 1.2em var(--lime)}
.card.locked{background:#101733;border:.14em dashed #2a3564;box-shadow:none;cursor:default;align-items:center;justify-content:center;color:#3c4a86;font:800 1em 'Barlow Condensed';text-align:center}
.card.locked:hover{transform:none}
.card.locked b{font-size:4em;line-height:1} .card.locked span{font-size:1.1em;letter-spacing:.1em}
.badge-new{position:absolute;top:.35em;right:.4em;background:var(--lime);color:#0a0f1f;font:800 .85em 'Barlow Condensed';padding:0 .7em;border-radius:1em;z-index:3;letter-spacing:.1em}
.openstage{padding:28px 12px;text-align:center;min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.bigcrate{position:relative;display:inline-block}
.bigcrate .crate{margin:30px auto 20px}
.bigcrate .crate .ball{animation:bob 1s ease-in-out infinite}
.bigcrate .xn{position:absolute;right:-.2em;top:.1em;font:800 56px 'Barlow Condensed',sans-serif;color:var(--lime);text-shadow:0 0 .4em #000;transform:rotate(8deg)}
.opk{gap:22px}
.opk.sz1 .card,.opk.sz1 .fcard{--fs:min(26px,4.3vh);font-size:var(--fs)}
.opk.sz2 .card,.opk.sz2 .fcard{--fs:min(19px,2.6vw);font-size:var(--fs)}
.opk.sz3 .card,.opk.sz3 .fcard{--fs:min(14px,1.6vw);font-size:var(--fs)}
.opk.sz3{gap:16px}
.fcard .cback{color:#fff;transition:transform .25s,filter .3s}
.fcard .cback[data-tz=gray]{background:linear-gradient(160deg,#9ca3af,#4b5563)}
.fcard .cback[data-tz=teal]{background:linear-gradient(160deg,#2dd4bf,#2563eb)}
.fcard .cback[data-tz=red]{background:linear-gradient(160deg,#fb7185,#9f1239)}
.fcard .cback[data-tz=rainbow]{background:conic-gradient(from 0deg,#f43f5e,#f59e0b,#eab308,#22c55e,#06b6d4,#6366f1,#d946ef,#f43f5e);animation:rainbow 1.2s linear infinite}
.fcard .cback[data-tz=orange]{background:linear-gradient(160deg,#ffae33,#c2410c)}
.fcard .cback[data-tz=black]{background:linear-gradient(160deg,#1f1f24,#000);border-color:#f5d76e;animation:none}
.fcard[data-tz=gray]{filter:drop-shadow(0 0 .6em #9ca3af88)}
.fcard[data-tz=teal]{filter:drop-shadow(0 0 1em #22d3eeaa)}
.fcard[data-tz=red]{filter:drop-shadow(0 0 1.2em #fb7185cc)}
.fcard[data-tz=rainbow]{filter:drop-shadow(0 0 1.6em #ffd23f)}
.fcard[data-tz=orange]{filter:drop-shadow(0 0 1.4em #ff8a00)}
.fcard[data-tz=black]{filter:drop-shadow(0 0 1.6em #f5d76e)}
.fcard .cback.pa{animation:tzA .6s}
.fcard .cback.pb{animation:tzB .6s}
.fcard .cback[data-tz=rainbow].pa,.fcard .cback[data-tz=rainbow].pb{animation:rainbow 1.2s linear infinite}
@keyframes tzA{0%{transform:scale(.94) rotate(-2deg);filter:brightness(1.8)}60%{transform:scale(1.06) rotate(1deg)}100%{transform:scale(1)}}
@keyframes tzB{0%{transform:scale(.94) rotate(2deg);filter:brightness(1.8)}60%{transform:scale(1.06) rotate(-1deg)}100%{transform:scale(1)}}
.invgrid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.invc{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;--fs:12px}
.invc .card{--fs:12px}
.invc .pips{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:20px;align-items:center;max-width:150px}
.invc .pip{width:12px;height:17px;border-radius:3px;background:#2a3050;border:1px solid #4a5280;display:block}
.invc .pip.on{background:var(--lime);border-color:#fff;box-shadow:0 0 6px var(--lime)}
.invc .mx{font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;color:var(--legend);text-transform:uppercase}
.invc .ii{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.invc .ii b{font:700 16px 'Barlow Condensed',sans-serif;letter-spacing:.05em}
.invc .ii span{font-size:13px}
.invc .ii small{font-size:11px;color:var(--mute)}
.badge-new.dup{background:#ffd23f}
.nb{font-size:.55em;font-weight:600;color:var(--mute);letter-spacing:0}
.invc .fx{position:absolute;left:50%;top:110px;width:0;height:0;pointer-events:none;z-index:20}
.invc .fx span{position:absolute;color:#ffd23f;text-shadow:0 0 .5em #ffb300;animation:burst 1.3s ease-out forwards;opacity:0}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.3)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(200deg)}}
.invc .fx .rg{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border:4px solid #ffd23f;border-radius:50%;animation:ring 1.2s ease-out forwards}
@keyframes ring{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.6)}}
.invc.ua1 .card{animation:ubounce .9s}
.invc.ua2 .card{animation:ubounce 1s}
.invc.ua3 .card{animation:ubounce 1.2s}
.invc.ua4 .card{animation:ushake 1.3s}
.invc.ua5 .card{animation:ushake 1.6s,rainbow 1.6s linear}
@keyframes ubounce{30%{transform:scale(1.18) rotate(-2deg);filter:brightness(1.6)}60%{transform:scale(.97)}}
@keyframes ushake{10%,50%,90%{transform:translateX(-4px) scale(1.12);filter:brightness(1.8)}30%,70%{transform:translateX(4px) scale(1.15)}}
.pack{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pack .card,.pack .fcard{--fs:15px}
.pack .card{animation:deal .35s both}
.pack .card:nth-child(2){animation-delay:.06s}.pack .card:nth-child(3){animation-delay:.12s}.pack .card:nth-child(4){animation-delay:.18s}.pack .card:nth-child(5){animation-delay:.24s}
@keyframes deal{from{opacity:0;transform:translateY(24px) rotate(-4deg)}}
.coins{align-self:center;padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.04em;white-space:nowrap}
[data-hk]{position:relative}
[data-hk]::before{content:attr(data-hk);position:absolute;top:4px;left:4px;z-index:6;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:#000b;color:var(--lime);font:700 12px/18px 'Barlow Condensed',sans-serif;text-align:center;pointer-events:none}
@media (hover:none){[data-hk]::before{display:none}}
button[data-hk]::before{top:-7px;left:-7px}
.dt{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--panel2)}
.dth{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dth .rk{font:700 22px 'Barlow Condensed',sans-serif;color:var(--mute)}
.dth .dov{font:800 40px 'Barlow Condensed',sans-serif;color:var(--lime);line-height:1}
.dth .dd{margin-left:auto;font-size:12px;color:var(--mute)}
.dpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.dp{background:#0004;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.dp i{font:700 11px 'Barlow Condensed',sans-serif;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;font-style:normal}
.dp b{font:700 15px 'Barlow Condensed',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp span{font-size:12px;color:var(--mute)}
.mini{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.mini .card{--fs:8px}
.mini.pick .card{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:12px;justify-items:center}
.grid .card{--fs:9.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:700 15px 'Barlow Condensed';letter-spacing:.06em;color:var(--mute)}
.filters button.on{background:var(--lime);color:#0a0f1f;border-color:var(--lime)}

/* Kisten */
.crate{--fs:16px;font-size:var(--fs);width:14em;height:11.5em;position:relative;margin:34px auto 20px;cursor:pointer}
.crate .box{position:absolute;left:0;right:0;bottom:0;top:3.4em;border:.25em solid #3b2510;border-radius:.3em .3em .6em .6em;box-shadow:0 1em 2em #000a;
  background:repeating-linear-gradient(0deg,#9a6631 0 1.4em,#6d4520 1.4em 1.55em);display:flex;align-items:center;justify-content:center}
.crate .lab{background:var(--lime);color:#0a0f1f;font:800 1.5em 'Barlow Condensed';letter-spacing:.14em;padding:.15em .8em;transform:rotate(-3deg);text-transform:uppercase;box-shadow:0 .2em .5em #0006}
.crate .lid{position:absolute;left:-.4em;right:-.4em;top:1.6em;height:2.2em;background:repeating-linear-gradient(90deg,#b07a3c 0 2em,#8a5a2b 2em 2.15em);border:.25em solid #3b2510;border-radius:.3em;transform-origin:left bottom;z-index:2}
.crate .ball{position:absolute;left:50%;top:-.3em;transform:translateX(-50%);font-size:3.6em;z-index:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-.25em)}}
.crate.final .box{background:repeating-linear-gradient(0deg,#ffd23f 0 1.4em,#c98a12 1.4em 1.55em);border-color:#6b4a06;box-shadow:0 0 3em #ffd23f88,0 1em 2em #000a}
.crate.final .lid{background:repeating-linear-gradient(90deg,#ffe27a 0 2em,#e0a91e 2em 2.15em);border-color:#6b4a06}
.crate.final .lab{background:#0a0f1f;color:var(--legend)}
.crate.shake{animation:shake .9s}
.crate.shake .lid{animation:lidup .9s .45s forwards}
@keyframes shake{10%,50%,90%{transform:translateX(-.3em) rotate(-2deg)}30%,70%{transform:translateX(.3em) rotate(2deg)}}
@keyframes lidup{to{transform:rotate(-70deg) translateY(-1em);opacity:0}}
.crates{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.crates .panel{text-align:center}
.crates .crate{--fs:12px;margin:24px auto 14px;cursor:default}
.crates .crate .ball{animation:none}
.crates h3{font-size:24px} .crates p{color:var(--mute);font-size:15px;margin-bottom:12px}
.cd{font:800 22px 'Barlow Condensed';color:var(--lime);letter-spacing:.06em}

/* Flip (ohne 3D, läuft in allen Browsern) */
.fcard{width:9em;height:18.4em;font-size:15px;cursor:pointer;flex:none;position:relative}
.fcard .in{position:relative;width:100%;height:100%}
.fcard .card{transform:scaleX(0);transition:transform .25s .25s}
.fcard.open .card{transform:scaleX(1)}
.fcard.open .cback{transform:scaleX(0)}
.fcard .card,.fcard .cback{position:absolute;inset:0}
.fcard .card{font-size:1em;width:100%;height:100%;animation:none}
.fcard .card.t3{animation:holo 6s linear infinite}
.fcard .cback{border-radius:.9em .9em .9em 2.4em;border:.14em solid #3a4a99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;
  background:repeating-linear-gradient(45deg,#151d42 0 .7em,#1a2452 .7em 1.4em);box-shadow:0 .5em 1.2em #0008;transition:transform .25s}
.fcard .cback span{font-size:3.4em}
.fcard .cback b{font:800 1.4em 'Barlow Condensed';letter-spacing:.3em;color:var(--lime)}
.fcard.open.g2 .card{box-shadow:0 0 1.2em .1em var(--elite)}
.fcard.open.g3 .card{box-shadow:0 0 1.8em .2em var(--legend)}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,#ffd23f 40%,#0000 70%);pointer-events:none;z-index:50;animation:fl .8s forwards}
@keyframes fl{from{opacity:.95}to{opacity:0}}
.tap{color:var(--mute);text-align:center;font:700 20px 'Barlow Condensed';letter-spacing:.2em;text-transform:uppercase;animation:bob2 1.4s infinite}
@keyframes bob2{50%{opacity:.4}}

/* Turnier / Saison / Match */
.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
@media(max-width:700px){.bracket{grid-template-columns:1fr}}
.rd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.rd.now{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}
.rd.won{opacity:.75;border-color:var(--pro)} .rd.lost{border-color:var(--elite)}
.rd h3{color:var(--mute);font-size:16px} .rd .t{font:800 26px 'Barlow Condensed';text-transform:uppercase;margin:4px 0}
.rd .r{color:var(--mute);font-size:14px}
.stages{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 16px}
.stages div{min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);font:800 16px 'Barlow Condensed';color:var(--mute)}
.stages div.done{background:var(--pro);color:#04231f;border-color:var(--pro)}
.stages div.now{background:var(--lime);color:#0a0f1f;border-color:var(--lime);box-shadow:0 0 12px var(--lime)}
.stages div.boss{border-radius:12px;border-color:var(--legend)}
.hearts{font-size:22px;letter-spacing:.1em}
.opp{text-align:center;margin:8px 0}
.opp .t{font:800 34px 'Barlow Condensed';text-transform:uppercase}
.opp .r{color:var(--mute);font-size:15px}
.score{background:linear-gradient(180deg,#0b1130,#0d1740);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.sb .tm{font:800 clamp(18px,4vw,30px) 'Barlow Condensed';text-transform:uppercase}
.sb .tm small{display:block;font-size:13px;color:var(--mute);letter-spacing:.1em}
.sb .pts{font:800 clamp(56px,14vw,110px)/1 'Barlow Condensed';min-width:1.4em}
.sb .pts.hit{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.18);color:var(--lime)}}
.sets{display:flex;gap:8px;justify-content:center;margin:8px 0;font:700 18px 'Barlow Condensed';color:var(--mute);flex-wrap:wrap}
.sets span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.log{margin-top:12px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.log div{background:var(--panel);border-left:4px solid var(--line);border-radius:6px;padding:8px 12px;text-align:left;font-size:16px;animation:deal .25s both}
.log div.a{border-color:var(--lime)} .log div.b{border-color:var(--elite)} .log div.end{border-color:var(--legend);background:var(--panel2);font-weight:600}
.result{text-align:center;padding:24px}
.result h2{font-size:clamp(40px,9vw,80px);line-height:1}
.result.win h2{color:var(--lime)} .result.loss h2{color:var(--elite)}
.reward{display:inline-block;margin-top:10px;background:var(--panel2);border:1px solid var(--legend);color:var(--legend);border-radius:999px;padding:4px 14px;font:700 18px 'Barlow Condensed';letter-spacing:.06em}
.rewards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rewards button{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;transition:transform .15s,border-color .15s}
.rewards button:hover{transform:translateY(-4px);border-color:var(--lime)}
.rewards .ic{font-size:40px} .rewards h3{font-size:26px;color:var(--lime);margin:6px 0} .rewards p{color:var(--mute);font-size:15px}
.foot{color:var(--mute);text-align:center;font-size:12px;margin:26px auto 0;max-width:720px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{background:var(--panel);color:var(--mute);font:700 13px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl td.o{font:800 17px 'Barlow Condensed';color:var(--lime)}
.tblwrap{overflow-x:auto}
.foot a{color:var(--lime);cursor:pointer;text-decoration:underline}
.card .st .na{background:#ffffffd9}
.card .st .na b{color:#000;font-size:1.35em}
.card .st .na i{color:#000a}
.card.pen{border-color:#ff3b3b;box-shadow:0 0 0 .22em #ff3b3b,0 0 1.4em #ff3b3b;filter:saturate(.55)}
.card .pen-tag{position:absolute;left:0;right:0;bottom:2.2em;text-align:center;background:#d81f1f;color:#fff;font:800 1em 'Barlow Condensed';letter-spacing:.06em;z-index:3;padding:.1em 0}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px}
.sl{font:800 12px 'Barlow Condensed';color:#fff;background:#000a;border-radius:6px;padding:0 9px;letter-spacing:.1em;text-transform:uppercase}
.sl.bad{background:#d81f1f}
.foot2{font:700 13px 'Barlow Condensed';letter-spacing:.06em;color:var(--lime);text-align:center}
.foot2.bad{color:#ff6a6a}
.courtbox{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.courtbox .lib{display:flex;flex-direction:column;align-items:center;gap:6px;font:700 13px 'Barlow Condensed';letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.pk{display:flex;flex-direction:column;align-items:center;gap:8px}
.dest{font:700 15px 'Barlow Condensed';letter-spacing:.05em;color:var(--lime);text-align:center;max-width:9em}
.dest.bad{color:#ff6a6a}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.lvl{text-align:left;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px;transition:transform .15s,border-color .15s}
.lvl:hover{transform:translateY(-4px);border-color:var(--lime)}
.lvl .lv{font:800 13px 'Barlow Condensed';letter-spacing:.2em;color:var(--mute)}
.lvl h3{font-size:26px;color:var(--lime);margin:4px 0}
.lvl p{color:var(--mute);font-size:14px;line-height:1.35;min-height:56px}
.lvl small{display:block;margin-top:10px;font-size:13px;color:var(--text);opacity:.85}
.lvl .pips{letter-spacing:.2em;color:var(--elite);font-size:14px}
.lvl.locked{opacity:.45;cursor:default}
.lvl.locked:hover{transform:none;border-color:var(--line)}
.nav .gear{font-size:18px;padding:4px 12px;line-height:1.2}
/* Match: Spielfeld mit Ballweg und Satz-Taktik */
.mcourt{position:relative;max-width:420px;margin:10px auto 0;border:2px solid #fff8;border-radius:10px;padding:6px;background:repeating-linear-gradient(90deg,var(--court) 0 46px,var(--court2) 46px 48px);transition:border-color .2s}
.mcourt:empty{display:none}
.mcourt.wa{border-color:var(--lime);box-shadow:0 0 12px #c6ff3d88}
.mcourt.wb{border-color:var(--elite);box-shadow:0 0 12px #ff5f7e88}
.mhalf{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mnet{height:6px;margin:5px -6px;background:repeating-linear-gradient(90deg,#fff 0 5px,#111 5px 10px)}
.mc{background:#0a0f1fb3;border:1px solid transparent;border-radius:6px;padding:3px 4px;font:700 13px 'Barlow Condensed';letter-spacing:.03em;text-transform:uppercase;color:#fff;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhalf.opp .mc{background:#3a0f1fcc}
.mc.lib{color:var(--legend)}
.mc.srv{border-color:#fff8}
.mc.on{border-color:#fff;background:#000}
.mball{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 2px #000;transition:left .16s linear,top .16s linear;pointer-events:none}
.focus{margin:12px 0;text-align:center}
.log:empty{display:none}
.focus h3{font-size:24px;color:var(--lime)}
.fprof{display:flex;gap:4px 10px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:4px}
.fprof b{color:var(--text)}
.fbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:10px}
.fbtns button{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left;transition:border-color .15s;display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center}
.fbtns .ic{grid-row:1/5}
.fbtns h4,.fbtns p{grid-column:2}
.fbtns .duel{color:var(--text);font-weight:600}
.fbtns .rep{color:var(--elite)}
.fhint{color:var(--mute);font-size:13px;margin-top:2px}
.fbtns button:hover{border-color:var(--lime)}
.fbtns .ic{font-size:26px}
.fbtns h4{font:800 20px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.04em;color:var(--lime)}
.fbtns p{color:var(--mute);font-size:14px;line-height:1.3}
.mode.daily{border-color:var(--lime)}
.dshare img{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:12px;border:1px solid var(--line)}
.tut ol{margin:8px 0 12px 20px;display:grid;gap:8px;font-size:16px;line-height:1.35}
/* Handy: Kopf in zwei Zeilen (Logo mit Münzen und Zahnrad, darunter die Reiter zum Wischen), im Draft die Kartenauswahl über dem Feld */
@media(max-width:700px){
  .wrap{padding:10px}
  header.top{gap:6px;padding:6px 0;margin-bottom:10px}
  .logo{font-size:22px;line-height:32px}
  .logo small{display:none}
  .nav{flex-wrap:nowrap;overflow-x:auto;width:100%;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:none;font-size:14px;padding:5px 10px}
  .nav .coins{position:absolute;top:7px;right:48px;font-size:14px;padding:4px 10px}
  .nav .gear{position:absolute;top:6px;right:0}
  .hero{padding:14px 4px 10px}
  .panel{padding:12px}
  .draft>.panel:last-child{order:-1}
  .pack{gap:8px}
  .pack .card,.pack .fcard{--fs:11px}

}

// Deutsch ist die Ausgangssprache: T('deutscher Text') schlägt die Übersetzung in der gewählten Sprache nach
// und gibt den deutschen Text zurück, wenn es keine gibt. Platzhalter stehen in geschweiften Klammern: T('Runde {n}', { n: 3 }).
// Die Übersetzungen liegen in i18n-en.js, i18n-pl.js, i18n-it.js, i18n-pt.js, i18n-zh.js, i18n-ja.js.
const LANGS = { de: 'Deutsch', en: 'English', pl: 'Polski', it: 'Italiano', pt: 'Português (BR)', zh: '中文', ja: '日本語' };
const LOCALE = { de: 'de-DE', en: 'en-US', pl: 'pl-PL', it: 'it-IT', pt: 'pt-BR', zh: 'zh-CN', ja: 'ja-JP' };
const I18N = {};
let LANG = 'de';

// Sprache des Browsers, sonst Englisch
function detectLang() {
  const n = (typeof navigator !== 'undefined' && navigator.language ? navigator.language : 'en').toLowerCase().slice(0, 2);
  return LANGS[n] ? n : 'en';
}
function setLang(l) { LANG = LANGS[l] ? l : 'en'; }

function T(s, v) {
  const d = I18N[LANG];
  let o = (d && d[s]) || s;
  if (v) o = o.replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m));
  return o;
}
// Markiert Texte in Datenlisten (werden erst bei der Anzeige übersetzt)
const TK = s => s;
// „Spieltag 3“ → übersetztes Wort plus Zahl. Eine Übersetzung darf die Stelle der Zahl mit {n} selbst bestimmen („第{n}節“).
function TN(s) {
  const m = /^(.*\D)\s(\d+)$/.exec(s || '');
  if (!m) return T(s || '');
  const b = T(m[1]);
  return b.includes('{n}') ? b.replace('{n}', m[2]) : b + ' ' + m[2];
}
// Objekt oder Liste, deren Texte beim Lesen übersetzt werden (die Sprache kann jederzeit wechseln)
const tmap = o => new Proxy(o, { get: (t, k) => (typeof t[k] === 'string' ? T(t[k]) : t[k]) });
// Zahlen und Daten in der Schreibweise der Sprache
const fmt = n => Number(n).toLocaleString(LOCALE[LANG]);
const fmtDate = t => new Date(t).toLocaleDateString(LOCALE[LANG]);

// ---------- Geheime Karte: Amore (99 auf allem, jede Position ohne Abzug, Chance 0,01 % pro gezogener Karte) ----------
const SECRET_P = 1e-4;
const AMORE = (() => {
  const R = {}; STATS.forEach(k => { R[k] = 99; });
  const forms = {};
  Object.keys(POS).forEach(role => { const rates = ratesFromRatings(role, R); clampRates(rates); forms[role] = { pos: role, ovr: 99, rates, ...R }; });
  return { id: 'secret-amore', name: 'Amore', full: 'Amore', nat: 'AMO', pos: 'OH', real: true, secret: true, any: true, h: 200, born: 2000, tier: 3, ovr: 99, ...R, R, rates: forms.OH.rates, forms, useF: 1.2, info: TK('Die geheime Karte: 99 auf allen Werten, spielt jede Position ohne Abzug') };
})();
const BY_ID = Object.fromEntries([...PLAYERS, ...FICT, AMORE].map(p => [p.id, p]));
// ersetzt (sehr selten) eine gezogene Karte durch Amore
const withSecret = (arr, exclude) => (exclude && exclude.has && exclude.has(AMORE.id)) ? arr : arr.map(p => Math.random() < SECRET_P && !arr.includes(AMORE) ? AMORE : p);


// ---------- Ziehen ----------
// Ziehungs-Wahrscheinlichkeit pro Karte (je besser die Stufe, desto seltener). Rookie / Pro / Elite / Legende.
const TIER_W = [.52, .395, .07, .015];        // Draft
const CRATE_W = [.58, .36, .05, .01];         // Trainingskiste (seltener als im Draft)
const CRATE_FINAL_W = [0, 0, .90, .10];       // Finalkiste: mindestens Elite
const TIER_MIN = () => [0, TIER_CUT[0] + 1, TIER_CUT[1], TIER_CUT[2]];

function drawPlayer(pool, exclude, minTier = 0, W = TIER_W) {
  const ws = W.map((w, t) => (t >= minTier ? w : 0));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0), t = 0;
  for (; t < 4; t++) { if ((r -= ws[t]) < 0) break; }
  t = Math.min(t, 3);
  let c = pool.filter(p => p.tier === t && !exclude.has(p.id));
  if (!c.length) c = pool.filter(p => p.tier >= minTier && !exclude.has(p.id));
  if (!c.length) c = pool.filter(p => !exclude.has(p.id));
  if (!c.length) return pick(pool);
  // Innerhalb von Elite und Legende sind die besseren Spieler zusätzlich seltener
  const lo = TIER_MIN()[Math.max(t, 0)];
  return t >= 2 ? wpick(c, p => Math.pow(.88, p.ovr - lo)) : pick(c);
}

function drawMany(pool, n, exclude, guarantees = [], W = TIER_W) {
  const ex = new Set(exclude), out = [];
  guarantees.forEach(t => { const p = drawPlayer(pool, ex, t, W); ex.add(p.id); out.push(p); });
  while (out.length < n) { const p = drawPlayer(pool, ex, 0, W); ex.add(p.id); out.push(p); }
  return out.sort(() => Math.random() - .5);
}

const makeDraftPack = (exclude, pool = PLAYERS) => withSecret(drawMany(pool, 5, exclude), exclude);
const makeCrate = type => withSecret(type === 'final' ? drawMany(PLAYERS, 1, new Set(), [2], CRATE_FINAL_W) : drawMany(PLAYERS, 1, new Set(), [], CRATE_W));

// Roguelike: Karten kommen aus dem eigenen Kader (Talente + freigeschaltete echte Spieler)
function makeRosterPack(unlockedIds, exclude, n = 5) {
  const real = unlockedIds.map(id => BY_ID[id]).filter(Boolean);
  const chanceReal = Math.min(.7, .2 + .01 * real.length);
  const ex = new Set(exclude), out = [];
  while (out.length < n) {
    const usable = real.filter(p => !ex.has(p.id));
    const pool = usable.length && Math.random() < chanceReal ? usable : FICT;
    const p = drawPlayer(pool, ex);
    ex.add(p.id); out.push(p);
  }
  return withSecret(out, exclude);
}

// ---------- Team ----------
function bondOf(lineup) {
  const cnt = {};
  lineup.forEach(p => { cnt[p.nat] = (cnt[p.nat] || 0) + 1; });
  let b = 0;
  Object.values(cnt).forEach(n => { b += n >= 4 ? 3 : n === 3 ? 2 : n === 2 ? 1 : 0; });
  return Math.min(b, 5);
}
// Effektive Punkte für Anzeige: Durchschnitt + Chemie + Team-Bonus + Spieler-Boni
const boostPts = p => (p.boost || 0) * 12 + (p.pen || 0); // Positionsstrafe steckt schon in den angezeigten Werten
function teamOvr(lineup, extra = 0, noBond = false) {
  if (!lineup.length) return 0;
  return Math.round(lineup.reduce((s, p) => s + p.ovr + boostPts(p), 0) / lineup.length + (noBond ? 0 : bondOf(lineup)) + extra);
}

// Team-Profil für die Anzeige (Werte der jeweils besten Spieler, ohne feste Positionen)
function profile(lineup, extra = 0) {
  const top = (k, n) => {
    const src = (k === 'atk' || k === 'blk' || k === 'srv') ? lineup.filter(p => p.pos !== 'L') : lineup;
    const a = src.map(p => p[k] + extra + boostPts(p)).sort((x, y) => y - x).slice(0, n);
    return a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
  };
  return {
    atk: top('atk', 3), blk: top('blk', 3), rec: top('rec', 3), def: top('def', 3),
    srv: (() => { const nl = lineup.filter(p => p.pos !== 'L'); return nl.length ? nl.reduce((s, p) => s + p.srv + extra + boostPts(p), 0) / nl.length : 0; })(),
    set: top('set', 1),
  };
}

const TEMPLATES = [['S', 'OH', 'MB', 'OPP', 'OH', 'MB', 'L']];

// Positions-Slots im Team = Aufstellung in Rotation 1: Feldposition 1 Zuspiel, 2 Außen, 3 Mitte, 4 Diagonal, 5 Außen, 6 Mitte; dazu der Libero (ersetzt die Mitte in der Hinterreihe)
const SLOT_POS = ['S', 'OH', 'MB', 'OPP', 'OH', 'MB', 'L'];
const SLOT_LAB = tmap({ OH: TK('Außen'), MB: TK('Mitte'), OPP: TK('Diagonal'), S: TK('Zuspiel'), L: TK('Libero') });
const SLOT_NAME = tmap([TK('Zuspieler'), TK('Außen'), TK('Mitte'), TK('Diagonal'), TK('Außen'), TK('Mitte'), TK('Libero')]);
const SLOT_PENALTY = 50;
// Spieler auf falscher Position bekommen −50 auf alle Werte (auch in der Simulation)
// Aktuelle Rolle eines Spielers als Wertepaket (zum Tauschen mit p.fa)
const formOf = p => { const f = { pos: p.pos, ovr: p.ovr, rates: p.rates }; STATS.forEach(k => { f[k] = p[k]; }); return f; };
const fitsRole = (p, role) => p.any || p.pos === role || !!(p.fa && p.fa.pos === role);
function fitTo(p, idx) {
  if (p.any) return { ...p, ...p.forms[SLOT_POS[idx]] }; // Amore: jede Position, immer 99
  p = p.unpen || p; // Positionsstrafe immer vom Original aus rechnen, damit Umsetzen umkehrbar ist
  if (p.pos === SLOT_POS[idx]) return p;
  if (p.fa && p.fa.pos === SLOT_POS[idx]) return { ...p, ...p.fa, fa: formOf(p) }; // Hybrid in der zweiten Rolle, ohne Abzug
  const o = { ...p, unpen: p, pen: SLOT_PENALTY, boost: (p.boost || 0) - SLOT_PENALTY / 12, ovr: Math.max(1, p.ovr - SLOT_PENALTY) };
  STATS.forEach(k => { o[k] = Math.max(1, p[k] - SLOT_PENALTY); });
  return o;
}
// Zwei Plätze tauschen (oder einen Spieler auf einen leeren Platz setzen)
function swapSlots(slots, a, b) {
  const pa = slots[a], pb = slots[b];
  slots[a] = pb ? fitTo(pb, a) : null;
  slots[b] = pa ? fitTo(pa, b) : null;
}
// Freier Slot der eigenen Position, sonst der erste freie Slot
function chooseSlot(slots, p) {
  if (p.any) return slots.findIndex(s => !s);
  let i = slots.findIndex((s, k) => !s && SLOT_POS[k] === p.pos);
  if (i < 0 && p.fa) i = slots.findIndex((s, k) => !s && SLOT_POS[k] === p.fa.pos);
  return i >= 0 ? i : slots.findIndex(s => !s);
}

const NAT_NAME = tmap({ ARG: TK('Argentinien'), AUS: TK('Australien'), BEL: TK('Belgien'), BRA: TK('Brasilien'), BUL: TK('Bulgarien'), CAN: TK('Kanada'), CHN: TK('China'), CUB: TK('Kuba'), FRA: TK('Frankreich'), GER: TK('Deutschland'), IRI: TK('Iran'), ITA: TK('Italien'), JPN: TK('Japan'), NED: TK('Niederlande'), POL: TK('Polen'), SLO: TK('Slowenien'), SRB: TK('Serbien'), TUR: TK('Türkei'), UKR: TK('Ukraine'), USA: TK('USA'), TUN: TK('Tunesien') });
// Anzeigename einer Mannschaft: Nationalteams heißen in jeder Sprache „Team <Land>“
const teamName = o => (o && o.natTeam && NAT_NAME[o.nat] ? T('Team {nation}', { nation: NAT_NAME[o.nat] }) : o ? o.name : '');
const avgOvr = lineup => lineup.reduce((s, p) => s + p.ovr, 0) / lineup.length;

// Gegner: Spieler aus dem Pool nahe am Ziel-Rating; dz verschiebt die Stärke (Schwierigkeit)
function makeOpponent(pool, target, dz, usedNats, exclude, o = {}) {
  let nat = o.nat, guard = 0;
  if (!nat) do { nat = pick(NAT_KEYS); } while (usedNats && usedNats.has(nat) && ++guard < 30);
  usedNats && usedNats.add(nat);
  const taken = new Set(exclude), lineup = [], homeP = o.homeP == null ? .6 : o.homeP, homeMin = o.homeMin || 2;
  pick(TEMPLATES).forEach(pos => {
    let c = pool.filter(p => p.pos === pos && !taken.has(p.id) && !p.evt);
    const home = c.filter(p => p.nat === nat);
    if (home.length >= homeMin && Math.random() < homeP) c = home;
    c = c.sort((a, b) => Math.abs(a.ovr - target) - Math.abs(b.ovr - target)).slice(0, 3);
    const p = pick(c);
    taken.add(p.id); lineup.push(p);
  });
  const bond = o.bond ? bondOf(lineup) : 0;
  return { name: o.name || NATIONS[nat].team, nat, lineup, bond, dz, ovr: Math.round(avgOvr(lineup) + bond + dz * 12) };
}

// ---------- Rally-Simulation ----------
// Gewichte pro Rolle (aus dem Anteil an Angriffen / Annahmen / Abwehr / Block in den Daten)
const W_ATT = { OH: .26, OPP: .27, MB: .095, S: .017, L: 0 };
const W_REC = { OH: .33, L: .28, OPP: .02, MB: .015, S: .005 };
const W_DIG = { OH: .165, OPP: .126, MB: .058, S: .166, L: .261 };
const W_BLK = { MB: .24, OH: .14, OPP: .15, S: .125, L: 0 };
// Rollenanteil je Passqualität (bei perfekter Annahme spielt die Mitte mehr Schnellangriffe)
const CTX_ROLE = {
  perf: { MB: 1.6, OPP: .95, OH: .92, S: 1, L: 1 },
  pos: { MB: 1.05, OPP: 1, OH: 1, S: 1, L: 1 },
  poor: { MB: .5, OPP: 1.2, OH: 1.15, S: 1, L: 1 },
  trans: { MB: .8, OPP: 1.15, OH: 1.1, S: 1, L: 1 },
};
// Angriffs-Kontext: Kill-Faktor, Fehler-Faktor, Block-Faktor (kalibriert gegen Realdaten)
const CTX = {
  perf: { k: 1.27, e: .66, b: .80 },
  pos: { k: 1.11, e: .89, b: 1.00 },
  poor: { k: .85, e: 1.26, b: 1.35 },
  trans: { k: .92, e: .94, b: 1.15 },
};
const OTHER_ERR = .017;   // sonstige Fehler pro Angriffssequenz (Netz, Doppelschlag, Zuspielfehler)
const SPLIT = { perf: .23, pos: .30 }; // Basis-Annahmeverteilung (perfekt / positiv), Rest = schwach
const PT = 1 / 12;

function prep(team) {
  const form = gs() * .45;
  const dzTeam = (team.bond || 0) * PT + (team.tactic || 0) + (team.dz || 0) + form;
  const rates = p => { const r = boosted(p.rates, dzTeam + (p.boost || 0)); return team.focus ? applyFocus(r, team.focus, team.fm) : r; };
  const ps = team.lineup.map((p, i) => ({ p, r: rates(p), pos: p.pos, useF: p.useF || 1, role: SLOT_POS[i] || p.pos, cp0: i < 6 ? i + 1 : 0 }));
  const wsum = (map, f) => { let s = 0, w = 0; ps.forEach(x => { const q = map[x.pos] || 0; s += q * f(x.r); w += q; }); return w ? s / w : 0; };
  let setter = ps[0];
  ps.forEach(x => { if (x.r.ast > setter.r.ast) setter = x; });
  return {
    name: teamName(team), ps,
    blkIdx: wsum(W_BLK, r => vBlk(r)) / POOL.blk,
    digIdx: wsum(W_DIG, r => r.dig) / POOL.dig,
    sq: clamp(setter.r.ast / ROLE.S.ast, .15, 1.35),
    setter, rot: 0,
  };
}

// Feldaufstellung nach r Rotationen im Uhrzeigersinn (Position 2 → 1 → 6 → 5 → 4 → 3 → 2).
// Der Libero ersetzt die Mitte auf Position 5 und 6. Steht die Mitte auf 1 (Aufschlag), spielen beide Mitten und der Libero wartet.
function courtView(T) {
  const lib = T.ps.find(x => x.role === 'L' && !x.cp0);
  T.cur = T.ps.filter(x => x.cp0).map(x => {
    const cp = ((x.cp0 - 1 - T.rot) % 6 + 6) % 6 + 1;
    return { cp, front: cp >= 2 && cp <= 4, base: x, x: lib && x.role === 'MB' && (cp === 5 || cp === 6) ? lib : x };
  });
}
function rotate(T) { T.rot = (T.rot + 1) % 6; courtView(T); }
const serverOf = T => T.cur.find(e => e.cp === 1).base;

function wpick(arr, wf) {
  let tot = 0; const ws = arr.map(x => { const w = wf(x); tot += w; return w; });
  let r = Math.random() * tot;
  for (let i = 0; i < arr.length; i++) { if ((r -= ws[i]) < 0) return arr[i]; }
  return arr[arr.length - 1];
}

let SIMSTAT = null; // optionaler Zähler für die Kalibrierung
const sc = (k, n = 1) => { if (SIMSTAT) SIMSTAT[k] = (SIMSTAT[k] || 0) + n; };

const KILL_TXT = [TK('{n} hämmert den Ball durch den Block'), TK('Smash von {n} – Punkt!'), TK('{n} schlägt die Diagonale ins Feld'), TK('{n} legt den Ball clever ab'), TK('Kraftvoller Angriff von {n}')];

// A schlägt auf, B nimmt an. Rückgabe: { win: Team, text }
let TR = []; // Ablauf des letzten Ballwechsels (für die Anzeige)
function rally(A, B) {
  const sv = serverOf(A);
  TR = [{ t: A, k: 'srv', n: sv.p.name }];
  const rc = wpick(B.cur, e => W_REC[e.x.pos] || 0).x;
  sc('serves');
  if (Math.random() < sv.r.serr) { sc('serr'); return { win: B, text: T('Aufschlagfehler von {n}', { n: sv.p.name }) }; }
  const pAce = clamp(sv.r.ace / (1 - sv.r.serr) * Math.pow(rc.r.rerr / .0706, .9), .003, .35);
  sc('recv');
  if (Math.random() < pAce) { TR.push({ t: B, k: 'rec', n: rc.p.name, q: 'ace' }); sc('ace'); sc('rerr'); return { win: A, text: T('Ass! {n} serviert direkt zum Punkt', { n: sv.p.name }) }; }
  // Annahmequalität: Aufschlagdruck (Ass-Quote) senkt die perfekte Annahme
  const pressure = clamp(1 - .30 * (sv.r.ace - .0575) / .05, .7, 1.3);
  const perfC = rc.r.perf / (1 - rc.r.rerr);
  const pPerf = clamp(perfC * pressure * (SPLIT.perf / .263), .04, .65);
  const pPos = clamp((SPLIT.pos + .35 * (perfC - .263)) * (pressure > 1 ? 1.03 : .97), .12, .5);
  const q = Math.random();
  let ctx = q < pPerf ? 'perf' : q < pPerf + pPos ? 'pos' : 'poor';
  sc('rq_' + ctx);
  TR.push({ t: B, k: 'rec', n: rc.p.name, q: ctx });

  let att = B, def = A, digs = 0, first = true;
  for (let ex = 0; ex < 16; ex++) {
    if (Math.random() < OTHER_ERR) { sc('other'); return { win: def, text: first ? T('Zuspielfehler bei {team}', { team: att.name }) : T('Ballfehler nach langer Abwehr') }; }
    const c = CTX[ctx], cr = CTX_ROLE[ctx];
    // Vorderreihe greift voll an (Mitte zählt doppelt, weil nur eine vorne steht), Hinterreihe nur Außen/Diagonal als Pipe
    const a = wpick(att.cur, e => (W_ATT[e.x.pos] || 0) * cr[e.x.pos] * e.x.useF * (e.front ? (e.x.pos === 'MB' ? 1.7 : 1) : (e.x.pos === 'OH' || e.x.pos === 'OPP' ? .5 : 0))).x;
    sc('att'); sc('att_' + a.pos);
    const stE = att.cur.find(e => e.x.pos === 'S');
    TR.push({ t: att, k: 'set', n: stE ? stE.x.p.name : a.p.name }, { t: att, k: 'att', n: a.p.name });
    const setMult = .75 + .25 * att.sq;
    const dfMult = clamp(1 - .9 * (def.digIdx - 1), .78, 1.22);
    const pStuff = STUFF_BASE * def.blkIdx * c.b;
    const pErrU = Math.max(.02, a.r.err - ERR_BLOCKED) * c.e;
    let pKill = a.r.kill * c.k * setMult * dfMult;
    let dug = 1 - pKill - pStuff - pErrU;
    if (dug < .12) { const f = (1 - .12) / (pKill + pStuff + pErrU); pKill *= f; dug = .12; }
    const y = Math.random();
    const pre = digs >= 2 ? T('Langer Ballwechsel!') + ' ' : '';
    if (y < pErrU) { sc('att_err'); return { win: def, text: pre + T('Angriffsfehler von {n}', { n: a.p.name }) }; }
    if (y < pErrU + pStuff * (1 - 0) ) {
      const bl = wpick(def.cur.filter(e => e.front), e => W_BLK[e.x.pos] || 0).x;
      TR.push({ t: def, k: 'blk', n: bl.p.name });
      sc('stuff'); sc('att_blocked');
      return { win: def, text: pre + T('Block! {a} stoppt {b}', { a: bl.p.name, b: a.p.name }) };
    }
    if (y < pErrU + pStuff + pKill) { sc('kill'); sc('kill_' + a.pos); return { win: att, text: pre + T(pick(KILL_TXT), { n: a.p.name }) }; }
    digs++; sc('dug');
    TR.push({ t: def, k: 'dig', n: wpick(def.cur, e => W_DIG[e.x.pos] || 0).x.p.name });
    [att, def] = [def, att];
    ctx = 'trans'; first = false;
  }
  return Math.random() < .5 ? { win: A, text: T('Endloser Ballwechsel – Punkt für den Aufschläger') } : { win: B, text: T('Endloser Ballwechsel – Punkt für die Annahme') };
}

function simSet(P, target, first) {
  const s = [0, 0], ev = [];
  let srv = first;
  P.forEach(t => { t.rot = 0; courtView(t); });
  for (let n = 0; n < 300; n++) {
    const pre = P.map(t => t.cur.slice().sort((a, b) => a.cp - b.cp).map(e => ({ n: e.x.p.name, lib: e.x !== e.base, s: t === P[srv] && e.base === serverOf(t) })));
    const r = rally(P[srv], P[1 - srv]);
    const tr = TR.map(x => ({ s: x.t === P[0] ? 0 : 1, k: x.k, n: x.n, q: x.q }));
    const w = r.win === P[srv] ? srv : 1 - srv;
    if (w === srv) sc('brk'); else { sc('sideout'); rotate(P[w]); }
    s[w]++; srv = w;
    ev.push({ w, text: r.text, sc: [s[0], s[1]], pre, tr });
    if (Math.max(s[0], s[1]) >= target && Math.abs(s[0] - s[1]) >= 2) break;
  }
  return { sc: s, ev };
}

// Best of 3: Sätze bis 25, Entscheidungssatz bis 15
// Satz-Taktik des Spielers: jede hat einen Vorteil und einen festen Nachteil.
// srv: mehr Asse und mehr Aufschlagfehler. atk: stärkerer Angriff, schwächerer Block und Abwehr. def: umgekehrt.
// Der Vorteil hängt am Duell mit dem Gegner (focusDuel): Die Taktik mit dem besten Duell wirkt am stärksten, die mit dem
// schlechtesten kaum (K je Sigma Abstand zum Schnitt der drei Duelle). Zweimal dieselbe Taktik hintereinander: Vorteil mal rep.
const FOCUS = { srv: { ace: .030, serr: .056 }, atk: { up: .68, down: .6 }, def: { up: .6, down: .6 }, K: 2, rep: .5, min: .2, max: 2.4 };
const FOCUS_KEYS = ['srv', 'atk', 'def'];
// Eigener Wert gegen den passenden Wert des Gegners, in Rating-Punkten
function focusDuel(f, t0, t1) {
  const a = profile(t0.lineup, (t0.bond || 0) + (t0.tactic || 0) * 12), b = profile(t1.lineup, (t1.bond || 0) + (t1.dz || 0) * 12);
  return f === 'srv' ? [a.srv, b.rec] : f === 'atk' ? [a.atk, (b.blk + b.def) / 2] : [(a.blk + a.def) / 2, b.atk];
}
function focusMult(f, t0, t1, last) {
  const e = {}; FOCUS_KEYS.forEach(k => { const d = focusDuel(k, t0, t1); e[k] = (d[0] - d[1]) / 12; });
  const mean = FOCUS_KEYS.reduce((x, k) => x + e[k], 0) / FOCUS_KEYS.length;
  return clamp(1 + FOCUS.K * (e[f] - mean), FOCUS.min, FOCUS.max) * (last === f ? FOCUS.rep : 1);
}
function applyFocus(r, f, m = 1) {
  const o = { ...r }, F = FOCUS[f];
  if (f === 'srv') { o.ace += F.ace * m; o.serr += F.serr; }
  else if (f === 'atk') { shiftMetric(o, 'atk', F.up * m); shiftMetric(o, 'def', -F.down); shiftMetric(o, 'blk', -F.down); }
  else if (f === 'def') { shiftMetric(o, 'def', F.up * m); shiftMetric(o, 'blk', F.up * m); shiftMetric(o, 'atk', -F.down); }
  return clampRates(o);
}

// Ein Match läuft Satz für Satz: matchStart legt den Stand an, matchNextSet spielt den nächsten Satz
// (focus = Satz-Taktik des ersten Teams). simMatch spielt alles am Stück durch.
function matchStart() { return { frames: [], sets: [], won: [0, 0], winner: null, done: false, live: true, firstServe: Math.random() < .5 ? 0 : 1 }; }
function matchNextSet(ms, t0, t1, focus) {
  if (ms.done) return ms;
  const teams = [t0, t1], won = ms.won, setNo = ms.sets.length;
  const foci = ms.foci || (ms.foci = []);
  const P = [prep(focus ? { ...t0, focus, fm: focusMult(focus, t0, t1, foci[foci.length - 1]) } : t0), prep(t1)];
  foci.push(focus || null);
  const target = setNo === 2 ? 15 : 25;
  const { sc: pts, ev } = simSet(P, target, setNo % 2 === 0 ? ms.firstServe : 1 - ms.firstServe);
  ev.forEach(e => ms.frames.push({ kind: 'rally', set: setNo, w: e.w, text: e.text, sc: e.sc, won: [...won], pre: e.pre, tr: e.tr }));
  const sw = pts[0] > pts[1] ? 0 : 1;

  }

    // Einstellungen übernehmen (an/aus, Lautstärke 0–1)

<script>

let V = 'home', G = null, M = null, O = null, R = null, ticker = null;

// ---- Speicher (localStorage, optional) ----
const newRogue = () => ({ unlocked: 1, runs: 0, lv: Array.from({ length: 5 }, () => ({ best: 0, clears: 0 })) });

const OLD_LEVELS = ['Bundesliga', 'Italienische Liga', 'Champions League', 'Olympia', 'Weltmeisterschaft'];
const dreamKind = d => d.kind || (/^Roguelike/.test(d.mode || '') ? 'rogue' : 'quick');
const dreamLevel = d => (d.lv != null ? d.lv : OLD_LEVELS.findIndex(n => (d.mode || '').includes(n)));
function recordDream() {
  if (!G || G.mode === 'career' || G.lineup.length !== TEAM_SIZE) return;

    team: G.slots.map((p, i) => ({ n: p.name, pos: SLOT_POS[i], ovr: p.ovr, f: NATIONS[p.nat] ? NATIONS[p.nat].f : '' })) };
}
function dailyCard() {
  const dl = P.daily && P.daily.d === today() ? P.daily : null, run = G && !G.over && G.daily;
  const st = run ? T('Läuft: weiterspielen') : dl && dl.st === 'done' ? T('Heute: {a} · Team {b}', { a: dailyLabel(dl), b: dl.ovr }) : dl ? T('Heute abgebrochen. Morgen gibt es neue Karten.') : T('Heute noch offen');
  return `<button class="mode daily" data-act="daily"><div class="ic">📅</div><h3>${T('Tages-Draft')}</h3><p>${T('Heute bekommen alle dieselben Karten und dieselben Gegner. Ein Versuch pro Tag, das Ergebnis kannst du teilen.')}</p><small>${st}${P.dstreak > 1 && dl ? ' · ' + T('Serie: {n} Tage', { n: P.dstreak }) : ''}</small></button>`;
}
function dailyAct() {
  if (G && !G.over && G.daily) return go('home');
  const dl = P.daily && P.daily.d === today() ? P.daily : null;
  if (dl) { if (dl.st === 'done') go('daily'); return; }
  if (G && !G.over && G.mode !== 'career' && !confirm(T('Ein laufender Run geht dabei verloren. Fortfahren?'))) return;
  newRun('quick', 0, today());
}
const dailyText = dl => `SIDEOUT ${T('Tages-Draft')} ${fmtDate(Date.parse(dl.d))}\n${[0, 1, 2].map(i => (i < dl.res.length ? (dl.res[i] ? '🟩' : '🟥') : '⬜')).join('')} ${dailyLabel(dl)} · ${T('Team')} ${dl.ovr}`;

// Bild zum Teilen (1080 × 1350): Ergebnis, Rating und die sieben Spieler
function dailyCanvas(dl) {
  const cv = document.createElement('canvas'), W = cv.width = 1080, H = cv.height = 1350, c = cv.getContext('2d');
  const F = (w, px) => `${w} ${px}px "Barlow Condensed", "Arial Narrow", sans-serif`;
  const box = (x, y, w, h, r, col) => { c.fillStyle = col; c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); c.fill(); };
  const txt = (s, x, y, font, col, align = 'left', max) => { c.font = font; c.fillStyle = col; c.textAlign = align; c.fillText(s, x, y, max); };
  c.fillStyle = '#0a0f1f'; c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(800, -100, 0, 800, -100, 900); g.addColorStop(0, '#1b2a6b'); g.addColorStop(1, 'rgba(10,15,31,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  txt('SIDE', 70, 150, F(800, 100), '#c6ff3d'); txt('OUT', 70 + c.measureText('SIDE').width, 150, F(800, 100), '#eef2ff');
  txt((T('Tages-Draft') + ' · ' + fmtDate(Date.parse(dl.d))).toUpperCase(), 70, 215, F(700, 44), '#8f9bc9');
  txt(dailyLabel(dl).toUpperCase(), 70, 400, F(800, 150), '#eef2ff', 'left', 940);
  [0, 1, 2].forEach(i => box(70 + i * 110, 445, 90, 90, 16, i < dl.res.length ? (dl.res[i] ? '#c6ff3d' : '#ff5f7e') : '#2a3564'));
  txt(T('Team-Rating').toUpperCase(), W - 70, 465, F(700, 40), '#8f9bc9', 'right');
  txt(String(dl.ovr), W - 70, 560, F(800, 110), '#c6ff3d', 'right');
  dl.team.forEach((p, i) => {
    const y = 620 + i * 90;
    box(70, y, W - 140, 78, 14, '#131a33');
    txt(p.pos, 100, y + 54, F(700, 44), '#c6ff3d');
    txt(String(p.n).toUpperCase(), 230, y + 56, F(700, 52), '#eef2ff', 'left', 540);
    txt(p.f, 800, y + 56, '52px sans-serif', '#fff');
    txt(String(p.ovr), W - 100, y + 58, F(800, 58), '#eef2ff', 'right');
  });
  txt('VOLLEYBALL DRAFT', W / 2, 1310, F(700, 36), '#8f9bc9', 'center');
  return cv;
}
function dailyShare(copy) {
  const dl = P.daily, say = t => { const m = document.getElementById('dmsg'); if (m) m.textContent = t; };
  if (!dl || dl.st !== 'done') return;
  const text = dailyText(dl), fail = () => say(T('Teilen geht hier nicht direkt. Halte das Bild gedrückt, um es zu sichern, oder mach einen Screenshot.'));
  if (copy) { try { navigator.clipboard.writeText(text).then(() => say(T('Kopiert.')), () => say(text)); } catch (e) { say(text); } return; }
  try {
    dailyCanvas(dl).toBlob(b => {
      const file = new File([b], `sideout-${dl.d}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], text }).catch(() => {});
      else fail();
    }, 'image/png');
  } catch (e) { fail(); }
}

// ---- Runs starten ----
function newRun(mode, level = 0, daily = null) {
  G = { mode, level, stages: mode === 'rogue' ? levelStages(level) : null, view: 'draft', slots: Array(TEAM_SIZE).fill(null), lineup: [], pack: null, rerolls: 3, used: new Set(), round: 0, stage: 0, tactic: 0, opps: [], opp: null, results: [], wins: 0 };
  if (daily) { G.daily = daily; dailyStart(daily); }
  G.pack = nextPack();
  if (mode === 'rogue') { P.rogue.runs++; save(); }
  V = 'draft'; render();
}
function abortRun() { G = null; M = null; V = 'home'; render(); }

function nextPack() { return G.mode === 'rogue' ? makeRosterPack(unlockedIds(), G.used) : dayRun(`p|${G.lineup.length}|${G.rerolls}`, () => makeDraftPack(G.used)); }

// ---- Draft ----
function hintsHTML(l) {
  return l.some(p => p.pen) ? `<div class="warn">⚠ ${T('Rot markierte Plätze: Spieler auf falscher Position bekommen −{n} auf alle Werte.', { n: SLOT_PENALTY })}</div>` : '';
}

function profHTML(l) {
  const pr = profile(l, bondOf(l) + G.tactic * 12);
  return `<div class="prof">${STATS.map(k => `<div>${STAT_LABEL[k]}<b>${l.length ? Math.round(pr[k]) : '–'}</b><i style="--w:${clamp((pr[k] - 40) / 60 * 100, 0, 100)}%"></i></div>`).join('')}</div>`;
}

const bribeBtn = () => (BRIBE_ON && !G.daily && (P.ref > 0 || G.bribe) ? `<button class="btn ghost" data-act="bribe">🟨 ${G.bribe ? T('Schiri bestochen (aktiv)') : T('Schiri bestechen (×{n})', { n: P.ref })}</button>` : '');
function rBracket() {
  const bs = bondSet(G.lineup);
  const mini = G.slots.map((p, i) => slotHTML(i, p, { bond: bs.has(p.nat), extra: G.mode === 'rogue' ? G.tactic * 12 : 0, attr: `data-act="slotsel" data-i="${i}"`, cls: SEL === i ? 'selme' : '' })).join('');

    app.innerHTML = `<div class="chips"><span class="chip mode">⚡ ${T('Schnelles Draft')}</span></div>
      <div class="panel"><div class="rhead"><h2>${T('Turnier')}</h2><span class="chip">${T('Dein Team')}: <b>${teamR(G.lineup)}</b></span></div>
      <div class="bracket">${rows}</div>
      <div class="mini">${mini}</div>
      <div class="controls">${bribeBtn()}<button class="btn" data-act="play">${T('{a} starten', { a: QUICK_ROUNDS[G.round].name })}</button></div></div>`;

  app.innerHTML = `<div class="chips"><span class="chip mode">${LV.flag} ${T('Stufe {n}', { n: G.level + 1 })}: ${LV.name}</span><span class="chip">${T('Team')} <b>${teamR(G.lineup, G.tactic * 12)}</b></span>${G.tactic ? `<span class="chip lime">${T('Taktik')} <b>+${Math.round(G.tactic * 12)}</b></span>` : ''}
    <button class="btn ghost sm" data-act="abort" style="margin-left:auto">${T('Aufgeben')}</button></div>
    <div class="panel"><div class="stages">${pills}</div>

      <div class="mini">${mini}</div>
      <div class="controls">${bribeBtn()}<button class="btn" data-act="play">${T('Spiel starten')}</button></div></div>`;
}

function beginStage() {
  const ex = new Set(G.lineup.map(p => p.id));
  G.opp = stageOpponent(G.level, G.stage, ex);
}

function rMatch() {
  const rogue = G.mode !== 'quick', o = rogue ? G.opp : G.opps[G.round];
  const bribed = G.pendingRes && G.pendingRes.bribed;
  const title = (bribed ? '🟨 ' : '') + (G.mode === 'career' ? G.title : rogue ? `${LEVELS[G.level].name} · ${TN(G.stages[G.stage].name)}` : QUICK_ROUNDS[G.round].name);
  app.innerHTML = `<div class="score">
    <div class="cond" style="color:var(--mute);letter-spacing:.2em">${title} · <span id="setno">${T('Satz {n}', { n: 1 })}</span></div>
    <div class="sb">
      <div class="tm">${T('Dein Team')}<small>${T('Rating {n}', { n: teamR(G.lineup, G.tactic * 12) })}</small></div><div></div>
      <div class="tm">${flagOf(o.nat)} ${teamName(o)}<small>${T('Rating {n}', { n: o.ovr })}</small></div>
      <div class="pts" id="pa">0</div><div class="cond" style="font-size:40px;color:var(--mute)">:</div><div class="pts" id="pb">0</div>
    </div>
    <div class="sets" id="sets"></div>
    <div class="mcourt" id="mcourt"></div>
    <div id="fbox"></div>
    <div class="controls" id="mctl"><button class="btn ghost" data-act="speed" id="speedbtn">${speedText(M ? M.speed : 0)}</button><button class="btn ghost" data-act="skip">${T('Überspringen')}</button></div>
    <div class="log" id="log"></div>
    <div id="after"></div></div>`;
}
const speedText = s => T('Tempo: {a}', { a: [T('langsam'), T('normal'), T('schnell')][s || 0] });

// Bestochener Schiri: das Team bekommt so lange Rückenwind, bis das Match gewonnen ist (Ergebnis steht fest, bevor es angezeigt wird)
function bribedMatch(mine, opp) {
  for (let k = 0; k < 60; k++) { const r = simMatch({ ...mine, dz: (mine.dz || 0) + k * .25 }, opp); if (r.winner === 0) { r.bribed = true; return r; } }
  const r = simMatch({ ...mine, dz: 20 }, opp); r.bribed = true; return r;
}
function startMatch() {
  const rogue = G.mode !== 'quick';
  const mine = { name: T('Dein Team'), lineup: G.lineup, bond: bondOf(G.lineup), tactic: G.tactic };
  delete G.matchDone;
  const opp = rogue ? G.opp : G.opps[G.round];
  if (!G.pendingRes) {
    if (BRIBE_ON && G.bribe && P.ref > 0 && !G.daily) { P.ref--; G.pendingRes = bribedMatch(mine, opp); } else G.pendingRes = dayRun('ms|' + G.round, matchStart);
    G.bribe = false;
  }
  M = { res: G.pendingRes, mine, opp, i: 0, delay: 1700, speed: 0, timer: null, setWins: [], done: false };
  G.view = 'match'; V = 'match';
  render();
  tick();
}

const setsHTML = sets => sets.map((s, i) => `<span>${T('Satz {n}', { n: i + 1 })}: ${s[0]}:${s[1]}</span>`).join('');
function showFrame(f) {
  const pa = document.getElementById('pa'), pb = document.getElementById('pb');
  if (!pa) return;
  pa.textContent = f.sc[0]; pb.textContent = f.sc[1];
  const hit = f.w === 0 ? pa : pb;
  if (f.kind === 'rally') { hit.classList.remove('hit'); void hit.offsetWidth; hit.classList.add('hit'); }
  document.getElementById('setno').textContent = (f.kind === 'setend' ? T('Satz {n} beendet', { n: f.set + 1 }) : T('Satz {n}', { n: f.set + 1 })) + (M.focus ? ' · ' + FOCUS_UI.find(x => x.k === M.focus).ic : '');
  if (f.kind === 'rally') animRally(f);
  if (f.kind === 'setend') M.setWins.push(f.sc);
  document.getElementById('sets').innerHTML = setsHTML(M.setWins);
  const log = document.getElementById('log'), d = document.createElement('div');
  d.className = f.kind === 'setend' ? 'end' : f.w === 0 ? 'a' : 'b';
  d.textContent = f.kind === 'rally' ? `${f.sc[0]}:${f.sc[1]}  ${f.text}` : f.text;
  log.prepend(d);
  while (log.children.length > 7) log.lastChild.remove();
}

function tick() {
  if (!M || M.done) return;
  if (M.i >= M.res.frames.length) return M.res.live && !M.res.done ? askFocus() : finishMatch();
  const f = M.res.frames[M.i++];
  showFrame(f);
  M.timer = setTimeout(tick, f.kind === 'setend' ? 2200 : M.delay);
}

function skip() {
  if (!M || M.done) return;
  const fr = M.res.frames;
  if (M.i >= fr.length) return; // wartet auf die Satz-Taktik
  clearTimeout(M.timer); clearTimeout(M.bt);
  M.i = fr.length; M.setWins = M.res.sets.slice(0, -1);
  showFrame(fr[fr.length - 1]);
  if (M.res.live && !M.res.done) return askFocus();
  finishMatch();
}

// ---- Spielfeld im Match: Aufstellung beider Teams und Weg des Balls ----
const escH = x => String(x).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
// pre[s] = sechs Spieler nach Feldposition 1 bis 6. Unten das eigene Team (Vorderreihe 4-3-2 am Netz), oben der Gegner gespiegelt.
function courtHTML(pre) {
  const cell = (s, cp) => { const e = pre[s][cp - 1]; return `<div class="mc${e.lib ? ' lib' : ''}${e.s ? ' srv' : ''}" data-s="${s}" data-n="${escH(e.n)}">${escH(e.n)}</div>`; };
  return `<div class="mhalf opp">${[1, 6, 5, 2, 3, 4].map(cp => cell(1, cp)).join('')}</div><div class="mnet"></div><div class="mhalf">${[4, 3, 2, 5, 6, 1].map(cp => cell(0, cp)).join('')}</div><i class="mball" id="mball"></i>`;
}
function animRally(f) {
  clearTimeout(M.bt);
  const court = document.getElementById('mcourt');
  if (!court || !f.pre) return;
  court.className = 'mcourt';
  court.innerHTML = courtHTML(f.pre);
  const ball = document.getElementById('mball'), cells = [...court.querySelectorAll('.mc')];
  const steps = (f.tr || []).map(x => cells.find(c => +c.dataset.s === x.s && c.dataset.n === x.n)).filter(Boolean);
  const won = () => court.classList.add(f.w === 0 ? 'wa' : 'wb');
  if (M.delay < 300 || !steps.length) { ball.style.display = 'none'; return won(); }
  const stepMs = Math.min(260, (M.delay - 150) / (steps.length + 1));
  let k = 0;
  const move = () => {
    const c = steps[k];
    cells.forEach(x => x.classList.remove('on')); c.classList.add('on');
    ball.style.left = c.offsetLeft + c.offsetWidth / 2 + 'px'; ball.style.top = c.offsetTop + 'px';
    M.bt = setTimeout(++k < steps.length ? move : won, stepMs);
  };
  move();
}

// ---- Satz-Taktik: vor jedem Satz eine von drei, jede mit Vorteil und Nachteil (Werte in engine.js, FOCUS) ----

const coinLine = (coins, win) => `<div class="reward">🪙 ${T('+{n} Münzen', { n: coins })}${win ? '' : ' ' + T('(Trost)')}</div>`;
const packsBtn = () => `<button class="btn ghost" data-go="packs">${T('Kisten öffnen')} (${P.packs.basic + P.packs.final})</button>`;
function finishMatch() {
  clearTimeout(M.timer); clearTimeout(M.bt);
  if (M.done) return;
  M.done = true;
  const { res } = M, win = res.winner === 0, rogue = G.mode === 'rogue';
  document.getElementById('sets').innerHTML = setsHTML(res.sets);
  const score = `${res.won[0]}:${res.won[1]}`, sub = (t, m = 6) => `<p style="color:var(--mute);margin:8px 0 ${m}px">${t}</p>`;
  const coins = prizeFor(win); P.money += coins;
  if (G.mode === 'career') {
    const html = careerResult(win, score);
    G.over = true; delete G.pendingRes; save(); nav();
    document.getElementById('after').innerHTML = coinLine(coins, win) + html;
    document.getElementById('mctl').remove();
    return;
  }
  let html = '', reward = '';
  if (!rogue) {
    const last = G.round === QUICK_ROUNDS.length - 1, oppName = teamName(G.opps[G.round]);
    G.results[G.round] = { win, sets: res.sets };
    if (win) { P.wins++; P.packs.basic++; reward = T('+{n}× Trainingskiste', { n: 1 }); }
    if (win && last) { P.titles++; P.packs.final++; reward += ' · ' + T('+{n}× Finalkiste', { n: 1 }); }
    const rw = reward ? `<div class="reward">🎁 ${reward}</div>` : '';
    if (win && last) html = `<div class="result win"><h2>${T('Turniersieg!')}</h2>${sub(T('Du hast alle drei Spiele gewonnen.'))}${rw}<div class="controls"><button class="btn" data-act="quick">${T('Neuer Draft')}</button>${packsBtn()}</div></div>`;
    else if (win) html = `<div class="result win"><h2>${T('Sieg')} ${score}</h2>${sub(T('Weiter: {a}.', { a: QUICK_ROUNDS[G.round + 1].name }))}${rw}<div class="controls"><button class="btn" data-act="next">${T('Weiter')}</button></div></div>`;
    else html = `<div class="result loss"><h2>${T('Ausgeschieden')}</h2>${sub(T('{score} gegen {opp} ({round}).', { score, opp: oppName, round: QUICK_ROUNDS[G.round].name }), 16)}<button class="btn" data-act="quick">${T('Neuer Draft')}</button></div>`;
  } else {
    const last = G.stage === STAGE_COUNT - 1, oppName = teamName(G.opp), LV = LEVELS[G.level], sl = P.rogue.lv[G.level], stName = TN(G.stages[G.stage].name);
    if (win) {
      G.wins++; P.wins++; P.packs.basic++; reward = T('+{n}× Trainingskiste', { n: 1 });
      sl.best = Math.max(sl.best, G.wins);
      if (last) {
        sl.clears++; P.titles++; P.packs.final += LV.finals; reward += ' · ' + T('+{n}× Finalkiste', { n: LV.finals });
        P.rogue.unlocked = Math.max(P.rogue.unlocked, Math.min(LEVELS.length, G.level + 2));
      }
      const rw = `<div class="reward">🎁 ${reward}</div>`, more = G.level < LEVELS.length - 1;
      html = last
        ? `<div class="result win"><h2>${T('Stufe {n} geschafft!', { n: G.level + 1 })}</h2>${sub(T('{name} gewonnen.', { name: LV.name }) + ' ' + (more ? T('Die nächste Stufe ist freigeschaltet.') : T('Du hast die höchste Liga gewonnen.')))}${rw}<div class="controls"><button class="btn" data-act="rogue">${more ? T('Nächste Stufe') : T('Neuer Run')}</button>${packsBtn()}</div></div>`
        : `<div class="result win"><h2>${T('Sieg')} ${score}</h2>${sub(T('{stage} geschafft. Wähle deine Belohnung.', { stage: stName }))}${rw}<div class="controls"><button class="btn" data-act="reward">${T('Belohnung wählen')}</button></div></div>`;
      if (last) G.view = 'runend';

      G.view = 'runend';
    }
  }
  G.over = !win || (rogue ? G.stage === STAGE_COUNT - 1 : G.round === QUICK_ROUNDS.length - 1);
  if (G.daily && G.over) { dailyDone(); html += `<div class="controls"><button class="btn" data-go="daily">📅 ${T('Ergebnis teilen')}</button></div>`; }
  delete G.pendingRes; G.matchDone = true;
  saveRun(); nav();
  document.getElementById('after').innerHTML = coinLine(coins, win) + html;
  document.getElementById('mctl').remove();
}

function openPack(type, n = 1) {
  n = Math.min(Math.max(n | 0, 1), 10, P.packs[type] || 0);
  if (!n) return;
  if (type === 'basic' && P.packs.basic >= FREE_CAP) P.lastFree = Date.now();
  P.packs[type] -= n;
  const cards = [], isNew = [], isDup = [];
  for (let k = 0; k < n; k++) makeCrate(type).forEach(p => { isNew.push(!P.coll[p.id]); isDup.push(!!P.coll[p.id]); P.coll[p.id] = (P.coll[p.id] || 0) + 1; cards.push(p); });
  save();
  O = { type, cards, isNew, isDup, flipped: cards.map(() => false), stage: 'intro' };
  V = 'open'; render();
}

// Farbenfolge als Teaser: grau → türkis → rot → regenbogen (Legende), bei der geheimen Karte am Ende schwarz, bei Event-Karten orange
const tzPath = p => p.secret ? ['gray', 'teal', 'red', 'rainbow', 'black'] : p.evt ? ['gray', 'teal', 'red', 'orange'] : [['gray'], ['gray', 'teal'], ['gray', 'teal', 'red'], ['gray', 'teal', 'red', 'rainbow']][p.tier];
function rOpen() {
  const o = O, n = O.cards.length;
  if (O.stage === 'intro') {
    app.innerHTML = `<div class="panel openstage"><div class="bigcrate">${crateHTML(O.type, '--fs:' + (n > 1 ? 30 : 36) + 'px')}${n > 1 ? `<div class="xn">×${n}</div>` : ''}</div><div class="tap">${n > 1 ? T('{n} Kisten werden geöffnet …', { n }) : T('Kiste wird geöffnet …')}</div></div>`;
    const c = document.querySelector('.bigcrate .crate'); if (c) c.classList.add('shake');
    setTimeout(() => { if (O === o && V === 'open' && o.stage === 'intro') { o.stage = 'cards'; render(); } }, 1700);
    return;
  }
  const sz = n === 1 ? 'sz1' : n <= 5 ? 'sz2' : 'sz3';
  app.innerHTML = `<div class="panel openstage"><div class="pack opk ${sz}">${O.cards.map((p, i) =>
    `<div class="fcard g${p.secret ? 0 : p.tier}${O.flipped[i] ? ' open' : ''}" data-act="flip" data-i="${i}"><div class="in">${cardHTML({ ...p, stars: levelOf(p.id) }, { isNew: O.isNew[i], dup: O.isDup && O.isDup[i] })}<div class="cback"><span>🏐</span><b>SIDEOUT</b></div></div></div>`).join('')}</div>
    <div class="controls" id="octl"></div></div>`;
  octl();
  if (!O.auto) { // Teaser: die Rückseite läuft durch die Farben bis zur echten Seltenheit, dann dreht sich die Karte von selbst
    O.auto = true;
    const STEP = 720;
    O.cards.forEach((p, k) => {
      const path = tzPath(p), t0 = 600 + (n > 1 ? k * 300 : 0);
      path.forEach((tz, j) => setTimeout(() => {
        if (O !== o || V !== 'open' || o.flipped[k]) return;
        const f = document.querySelectorAll('.fcard')[k]; if (!f) return;
        const cb = f.querySelector('.cback');
        f.dataset.tz = tz; cb.dataset.tz = tz; cb.classList.toggle('pa', j % 2 === 0); cb.classList.toggle('pb', j % 2 === 1);
      }, t0 + j * STEP));
      setTimeout(() => { if (O === o && V === 'open') flip(k); }, t0 + path.length * STEP + (path.length > 3 ? 650 : 350));
    });
  }
}
function octl() {
  const el = document.getElementById('octl');
  if (!el) return;
  el.innerHTML = O.flipped.every(Boolean)
    ? `<button class="btn" data-go="packs">${T('Fertig')}</button>${P.packs[O.type] ? `<button class="btn ghost" data-act="openpack" data-type="${O.type}">${T('Nächste Kiste ({n})', { n: P.packs[O.type] })}</button>` : ''}${P.packs[O.type] > 1 ? `<button class="btn ghost" data-act="openpack" data-type="${O.type}" data-n="10">${T('{n} weitere öffnen', { n: Math.min(10, P.packs[O.type]) })}</button>` : ''}${dupTotal() ? `<button class="btn ghost" data-go="inv">${T('Inventar')}</button>` : ''}`
    : `<button class="btn ghost" data-act="flipnow">${T('Sofort aufdecken')}</button>`;
}

function flip(i) {
  if (!O || O.flipped[i]) return;
  O.flipped[i] = true;
  document.querySelectorAll('.fcard')[i].classList.add('open');
  if (O.cards[i].tier === 3) { const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 900); }
  octl();
}

// Platz im Kader, den ein Neuzugang einnehmen würde (nie dein eigener)
function careerSlotFor(c, p) {

  SLOT_POS.forEach((r, k) => { if (k !== hs && (r === p.pos || (p.fa && p.fa.pos === r)) && (best < 0 || BY_ID[c.mates[k]].ovr < BY_ID[c.mates[best]].ovr)) best = k; });
  return best;
}
function rCClub() {

    const slot = careerSlotFor(c, p), old = slot >= 0 ? BY_ID[c.mates[slot]] : null, pr = priceOf(p), back = old ? Math.round(priceOf(old) * .6) : 0, net = pr - back;

const careerOppFromPend = o => ({ name: o.name, nat: o.nat, natTeam: o.natTeam, ovr: o.ovr, bond: o.bond || 0, dz: o.dz || 0, lineup: o.ids.map(id => BY_ID[id]) });
// Spiel vorbereiten (Gegner, Aufstellung, Ergebnis)
function careerBuild(c, kind) {
  const inj = c.inj > 0 && kind !== 'challenge', lineup = careerLineup(c, c.role, inj), ex = new Set(lineup.map(p => p.id));
  const opp = kind === 'challenge' ? makeOpponent(PLAYERS.filter(p => !p.evt), teamOvr(lineup) + 6, .3, new Set(), ex, { name: T('Weltklasse-Auswahl') }) : careerMakeOpp(c, careerOppClub(c), ex);
  const res = simMatch({ name: c.club, lineup, bond: bondOf(lineup), tactic: 0 }, opp);
  res.frames.forEach(f => { delete f.pre; delete f.tr; });
  return { kind, md: c.season.md, role: c.role, inj, res, opp: { name: opp.name, nat: opp.nat, natTeam: opp.natTeam, ovr: opp.ovr, bond: opp.bond, dz: opp.dz, ids: opp.lineup.map(p => p.id) } };
}
const careerKind = c => (c.po ? c.po.stage : 'league');
function careerPlay(kind) {
  const c = P.career; if (!c) return;
  if (G && !G.over && G.mode !== 'career' && !confirm(T('Ein laufender Run geht dabei verloren. Fortfahren?'))) return;
  if (c.pend && c.pend.opp.ids.some(id => !BY_ID[id])) c.pend = null;
  if (!c.pend) { c.pend = careerBuild(c, kind); save(); }
  const pe = c.pend, lineup = careerLineup(c, pe.role, pe.inj), opp = careerOppFromPend(pe.opp);
  const title = pe.kind === 'challenge' ? '🎫 ' + T('Super-Challenge') : `${CAREER[c.league].name} · ${phaseText(pe.kind, pe.md || 0)}`;
  G = { mode: 'career', view: 'match', slots: lineup, lineup, opp, title, pendingRes: pe.res, over: false, tactic: 0, wins: 0 };

// Mehrere Spieltage ohne Animation spielen (Ergebnisse zählen genauso)
function careerSimLeague() {
  const c = P.career; let w = 0, l = 0, n = 0, tp0 = c.tp, last = null;
  if (c.pend) return careerPlay(careerKind(c));
  while (!c.retired && !c.po && n < 30) {
    const pe = careerBuild(c, 'league'), win = pe.res.winner === 0;
    P.money += prizeFor(win, 'career'); const o = careerApply(c, win, 'league'); n++; if (win) w++; else l++; last = o;

  save(); render();
}
const seasonText = s => T('Saison beendet: Platz {n}', { n: s.rank }) + (s.title ? ' · ' + T('MEISTER') + ' 🏆' : '') + (s.promoted ? ' · ' + T('Aufstieg in die {a}', { a: s.now }) : s.relegated ? ' · ' + T('Abstieg in die {a}', { a: s.now }) : '') + ` · +${fmt(s.bonus)} 💶 · +${s.tp} TP`;
