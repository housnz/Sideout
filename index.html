// ---- Shop: Duplikate kaufen (teuer) und „Schiri bestechen“ ----
let SF = 'ALL';
function rShop() {
  const owned = ownedIds().map(id => BY_ID[id]).sort((a, b) => b.ovr - a.ovr);
  const list = SF === 'ALL' ? owned : owned.filter(p => p.pos === SF);
  const row = p => { const pr = DUP_PRICE[p.tier]; return `<div class="srow t${p.tier}${p.evt ? ' evt' : ''}"><span class="sov">${p.ovr}</span><span class="snm">${p.name}<small>${p.pos} · ${flagOf(p.nat)} · ${p.evt ? evtLabel() : TIERS[p.tier]}</small></span><span class="sdup">×${P.coll[p.id]} · ${levelOf(p.id)}★</span><button class="btn sm" data-act="buydup" data-id="${p.id}" ${P.money >= pr ? '' : 'disabled'}>${fmt(pr)} 🪙</button></div>`; };
  app.innerHTML = `<div class="panel"><div class="rhead"><h2>${T('Shop')}</h2><span class="chip">${T('Münzen')} <b>${fmt(P.money)}</b></span></div>
    ${BRIBE_ON ? `<div class="item"><div class="ic">🟨</div><div class="itx"><h3>${T('Schiri bestechen')}</h3><p>${T('Einmal benutzt, gewinnst du das nächste Match sicher. Aktivierung vor dem Spiel im Turnier-Bildschirm.')} ${T('Du hast: {n}', { n: `<b>${P.ref}</b>` })}</p></div>
      <button class="btn" data-act="buyref" ${P.money >= REF_PRICE ? '' : 'disabled'}>${fmt(REF_PRICE)} 🪙</button></div>` : ''}</div>
    <div class="panel" style="margin-top:14px"><div class="rhead"><h2>${T('Duplikate kaufen')}</h2><span class="chip">${T('nur für Spieler, die du hast')}</span></div>
      <p class="hint" style="margin-bottom:8px">${T('Ein gekauftes Duplikat landet wie ein gezogenes im Inventar. Die Preise sind absichtlich hoch.')}</p>
      <div class="filters">${posFilter('spos', SF)}</div>
      <div class="shoplist">${list.map(row).join('') || `<p class="hint">${T('Du hast noch keine Spieler dieser Position. Öffne Kisten!')}</p>`}</div></div>`;
}

// ---- Inventar: Duplikate zu Aufwertungen machen ----
function rInv() {
  const ids = ownedIds().filter(id => (P.coll[id] || 0) > 1 || levelOf(id) > 0);
  ids.sort((a, b) => (dupsOf(b) >= costOf(b)) - (dupsOf(a) >= costOf(a)) || BY_ID[b].ovr - BY_ID[a].ovr);
  const item = id => {
    const p = BY_ID[id], lv = levelOf(id), d = dupsOf(id), max = lv >= MAX_LVL, cost = costOf(id);
    const pips = max ? `<span class="mx">${T('Maximal')}</span>` : Array.from({ length: cost }, (_, k) => `<i class="pip${k < d ? ' on' : ''}"></i>`).join('');
    return `<div class="invc" data-id="${id}">${cardHTML({ ...p, stars: lv }, { data: `data-cid="${id}"` })}
      <div class="pips" title="${max ? T('Maximale Stufe') : T('Duplikate für den nächsten Stern: {n}', { n: cost })}">${pips}</div>
      <button class="btn sm" data-act="upg" data-id="${id}" ${!max && d >= cost ? '' : 'disabled'}>${T('Aufwerten')}</button></div>`;
  };
  app.innerHTML = `<div class="panel"><div class="rhead"><h2>${T('Inventar')}</h2><span class="chip">${T('Freie Duplikate')} <b>${dupTotal()}</b></span></div>
    <p class="hint" style="margin-bottom:10px">${T('Ziehst du einen Spieler, den du schon hast, bekommst du ein Duplikat. Hier wertest du damit Karten auf, bis zu 5 Sterne mit schönerem Rahmen. Der erste Stern kostet 1 Duplikat, der zweite 2, der dritte 3 und so weiter. Im Roguelike steigt dein Spieler dadurch um +2 bis +6 Rating. Im Schnellen Draft zählen Aufwertungen nicht.')}</p>
    <div class="invgrid">${ids.map(item).join('') || `<p class="hint">${T('Noch keine Duplikate. Öffne Kisten, irgendwann ziehst du jemanden doppelt.')}</p>`}</div></div>`;
}
function upgradeCard(id) {
  if (!BY_ID[id] || levelOf(id) >= MAX_LVL || dupsOf(id) < costOf(id)) return;
  P.lvl[id] = levelOf(id) + 1; save();
  const lv = P.lvl[id], y = window.scrollY;
  render(); window.scrollTo(0, y);
  const el = document.querySelector(`.invc[data-id="${id}"]`); if (!el) return;
  el.classList.add('ua' + lv);
  const fx = document.createElement('div'); fx.className = 'fx';
  const n = [0, 8, 14, 22, 32, 48][lv], sym = ['', '✦', '✦', '★', '★', '★'][lv];
  for (let k = 0; k < n; k++) {
    const s = document.createElement('span'), a = Math.random() * 6.283, r = 60 + Math.random() * (50 + lv * 30);
    s.textContent = lv >= 4 && k % 3 === 0 ? '✨' : sym;
    s.style.cssText = `--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px;animation-delay:${Math.random() * .25}s;font-size:${10 + Math.random() * 10 + lv * 2}px`;
    fx.appendChild(s);
  }
  if (lv >= 2) { const rg = document.createElement('i'); rg.className = 'rg'; fx.appendChild(rg); }
  el.appendChild(fx);
  if (lv >= 5) { const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 900); }
  setTimeout(() => { el.classList.remove('ua' + lv); fx.remove(); }, 2200);
}

// ---- Dream Teams ----
function rDream() {
  const mode = d => { const lv = dreamLevel(d); return dreamKind(d) === 'rogue' ? T('Roguelike') + (LEVELS[lv] ? ' · ' + LEVELS[lv].name : '') : T('Schnelles Draft'); };
  const row = (d, i) => `<div class="dt"><div class="dth"><span class="rk">#${i + 1}</span><b class="dov">${d.ovr}</b><span class="chip">${mode(d)}</span><span class="dd">${fmtDate(d.t)}</span></div>
    <div class="dpl">${d.pl.map((p, k) => `<div class="dp t${p.tier}${p.pen ? ' pen' : ''}"><i>${SLOT_NAME[k]}</i><b>${p.n}</b><span>${flagOf(p.nat)} ${p.ovr}</span></div>`).join('')}</div></div>`;
  const sec = (title, k) => { const l = P.dream.filter(d => dreamKind(d) === k).sort((a, b) => b.ovr - a.ovr); return `<div class="panel" style="margin-bottom:14px"><div class="rhead"><h2>${title}</h2><span class="chip">Top 5</span></div>${l.map(row).join('') || `<p class="hint">${T('Noch kein komplettes Team in diesem Modus.')}</p>`}</div>`; };
  app.innerHTML = `<h2 style="margin:4px 0 6px">${T('Deine Dream Teams')}</h2>
    <p class="hint" style="margin-bottom:12px">${T('Deine besten Zusammenstellungen, getrennt nach Modus. Es zählt nur das Team-Rating, nicht wie weit du damit gekommen bist. Eine Erinnerung an deine glücklichsten Drafts.')}</p>
    ${sec('⚡ ' + T('Schnelles Draft'), 'quick')}${sec('🎲 ' + T('Roguelike'), 'rogue')}`;
}


// ---- Tastenkürzel (nur Einzeltasten ohne Strg/Cmd/Alt, nicht in Eingabefeldern) ----
const HK_SEL = ['.pk [data-act=pick]', '.rewards button', '[data-act=rw-card]', '.ctr [data-act=ctrain]:not([disabled])', '.mini.pick [data-act]', '.invc [data-act=upg]:not([disabled])', '.fcard', '[data-act=openpack]:not([disabled])'];
function hkTargets() {
  for (const s of HK_SEL) { const l = [...document.querySelectorAll('#app ' + s)]; if (l.length) return l.slice(0, 9); }
  return [];
}
function markHotkeys() {
  document.querySelectorAll('[data-hk]').forEach(e => e.removeAttribute('data-hk'));
  const l = hkTargets(); if (l.length > 1) l.forEach((e, i) => e.setAttribute('data-hk', i + 1));
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  const el = document.activeElement, dlg = document.getElementById('savedlg'), sp = document.getElementById('setpop');
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { dlg.hidden = true; sp.hidden = true; return; }
  if (!dlg.hidden) return;
  const click = sel => { const b = document.querySelector(sel); if (b && !b.disabled) { e.preventDefault(); b.click(); return true; } };
  if (/^[1-9]$/.test(k)) { const t = hkTargets()[+k - 1]; if (t) { e.preventDefault(); t.click(); } return; }
  if (k === 'enter') { if (el && /^(BUTTON|A)$/.test(el.tagName)) return; click('#app .btn:not(.ghost):not([disabled])'); return; }
  if (k === 'r') return void click('#app [data-act=reroll]');
  if (k === 't') return void click('#app [data-act=speed]');
  if (k === 's') return void click('#app [data-act=skip]');
  if (k === 'm') { const m = document.getElementById('mus'); m.checked = !m.checked; m.dispatchEvent(new Event('change')); }
});

document.addEventListener('input', e => { if (e.target.id === 'cn-name' && CN) CN.name = e.target.value; if (e.target.id === 'cn-club' && CN) CN.club = e.target.value; });
document.addEventListener('change', e => {
  if (e.target.id === 'cn-nat' && CN) { CN.nat = e.target.value; render(); }
  if (e.target.id === 'lang') { setLang(e.target.value); P.settings.lang = LANG; save(); applyStatic(); if (!(V === 'match' && M && !M.done)) render(); else nav(); }
});

// ---- Spielstand-Dialog ----
function saveAct(a) {
  const dlg = document.getElementById('savedlg'), tx = document.getElementById('savetxt'), msg = document.getElementById('savemsg');
  const say = s => { msg.textContent = s; };
  if (a === 'savedlg') { saveRun(); tx.value = exportCode(); say(''); dlg.hidden = false; document.getElementById('setpop').hidden = true; return; }
  if (a === 'saveclose') { dlg.hidden = true; return; }
  if (a === 'savecopy') {
    tx.select();
    try { navigator.clipboard.writeText(tx.value).then(() => say(T('Kopiert.')), () => { document.execCommand('copy'); say(T('Kopiert.')); }); } catch (e) { try { document.execCommand('copy'); say(T('Kopiert.')); } catch (e2) { say(T('Markiere den Text und kopiere ihn von Hand.')); } }
    return;
  }
  if (a === 'savefile') {
    try {
      const b = new Blob([tx.value], { type: 'text/plain' }), u = URL.createObjectURL(b), l = document.createElement('a');
      l.href = u; l.download = 'sideout-save.txt'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
      say(T('Datei gespeichert (Ordner „Downloads“).'));
    } catch (e) { say(T('Speichern als Datei geht hier nicht, nimm den Code zum Kopieren.')); }
    return;
  }
  if (a === 'savepick') return document.getElementById('savein').click();
  if (a === 'saveload') {
    let ok = false;
    try { ok = importCode(tx.value); } catch (e) {}
    if (!ok) return say(T('Das ist kein gültiger Spielstand.'));
    dlg.hidden = true; V = 'home'; applyStatic(); syncSettings(); render();
  }
}
document.getElementById('savein').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(s => { document.getElementById('savetxt').value = s; saveAct('saveload'); }).catch(() => { document.getElementById('savemsg').textContent = T('Datei konnte nicht gelesen werden.'); });
  e.target.value = '';
});

// ---- Events ----
document.addEventListener('click', e => {
  const sp = document.getElementById('setpop');
  if (sp && !sp.hidden && !e.target.closest('#setpop, [data-act=settings]')) sp.hidden = true;
  const g = e.target.closest('[data-go]');
  if (g) return go(g.dataset.go);
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, i = +t.dataset.i;
  if (a === 'settings') { sp.hidden = !sp.hidden; return; }
  if (a.startsWith('save')) return saveAct(a);
  if (a === 'daily') return dailyAct();
  if (a === 'dshare' || a === 'dcopy') return dailyShare(a === 'dcopy');
  if (a === 'quick') return newRun('quick');
  if (a === 'rogue') { G = null; V = 'levels'; return render(); }
  if (a === 'startlevel') return newRun('rogue', i);
  if (a === 'restart') return newRun(G.mode, G.level);
  if (a === 'abort') return abortRun();
  if (a === 'slotsel') {
    if (SEL == null) { if (G.slots[i]) SEL = i; } else if (SEL === i) SEL = null; else { swapSlots(G.slots, SEL, i); SEL = null; syncLineup(); }
    return render();
  }
  if (a === 'pick') {
    const p0 = G.pack[i], base = G.mode === 'rogue' ? runPlayer(p0, levelOf(p0.id)) : p0;
    const idx = chooseSlot(G.slots, base);
    if (!fitsRole(base, SLOT_POS[idx]) && WARN !== i) { WARN = i; return render(); }
    WARN = null;
    G.slots[idx] = fitTo(base, idx); syncLineup(); G.used.add(p0.id);
    G.pack = G.lineup.length < TEAM_SIZE ? nextPack() : null;
    return render();
  }
  if (a === 'tutok') { P.tut = 1; save(); return render(); }
  if (a === 'reroll' && G.rerolls > 0) { WARN = null; G.rerolls--; G.pack = nextPack(); return render(); }
  if (a === 'tournament') {
    if (G.mode === 'quick') {
      const nats = new Set(), ex = new Set(G.lineup.map(p => p.id));
      const easy = !G.daily && !P.titles && (P.qn || 0) < QUICK_EASY.runs;
      P.qn = (P.qn || 0) + 1; save();
      G.opps = dayRun('opp', () => QUICK_ROUNDS.map((r, k) => { if (easy && !k) r = QUICK_EASY; const o = makeOpponent(PLAYERS, r.target, r.dz, nats, ex); o.lineup.forEach(p => ex.add(p.id)); return o; }));
      G.round = 0; G.results = [];
    } else { G.stage = 0; G.wins = 0; beginStage(); }
    G.view = 'bracket'; V = 'bracket'; return render();
  }
  if (a === 'play') return startMatch();
  if (a === 'next') { G.round++; G.view = 'bracket'; V = 'bracket'; M = null; return render(); }
  if (a === 'reward') return rewardStart();
  if (a === 'runend') { G.view = 'runend'; V = 'runend'; return render(); }
  if (a === 'rw-recruit') { R.step = 'recruit'; R.cards = makeRosterPack(unlockedIds(), new Set(G.lineup.map(p => p.id)), 3); return render(); }
  if (a === 'rw-train') { R.step = 'train'; return render(); }
  if (a === 'rw-tactic') { G.tactic += .08; R.step = 'tactic'; return render(); }
  if (a === 'rw-done') return rewardDone();
  if (a === 'rw-card') { R.picked = runPlayer(R.cards[i], levelOf(R.cards[i].id)); R.step = 'replace'; return render(); }
  if (a === 'rw-replace') { G.slots[i] = fitTo(R.picked, i); return rewardDone(); }
  if (a === 'rw-trainpick') { G.slots[i] = upgradeP(G.slots[i], 4, 'train' + G.stage); return rewardDone(); }
  if (a === 'speed' && M) {
    M.speed = ((M.speed || 0) + 1) % 3;
    M.delay = [1700, 750, 90][M.speed];
    document.getElementById('speedbtn').textContent = speedText(M.speed);
    return;
  }
  if (a === 'skip') return skip();
  if (a === 'focus') return setFocus(t.dataset.f);
  if (a === 'openpack') return openPack(t.dataset.type, +t.dataset.n || 1);
  if (a === 'upg') return upgradeCard(t.dataset.id);
  if (a === 'career') { if (!P.career) CN = newCN(); return go(P.career ? 'career' : 'cnew'); }
  if (a === 'cn-role') { CN.role = t.dataset.v; CN.pts = {}; return render(); }
  if (a === 'cn-color') { CN.color = +t.dataset.v; return render(); }
  if (a === 'cn-plus' || a === 'cn-minus') { const k = t.dataset.k; CN.pts[k] = Math.max(0, (CN.pts[k] || 0) + (a === 'cn-plus' ? 1 : -1)); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (a === 'cn-start') {
    const tmp = cnTemp(), nm = (CN.name || '').trim() || T('Du');
    const c = { name: nm, club: (CN.club || '').trim() || `${nm} Volleys`, nat: CN.nat, pos0: CN.role, role: CN.role, alt: null, color: CN.color, R: tmp.R, age: START_AGE, season_no: 1, league: 0, tp: 0, tickets: 0, wins: 0, losses: 0, titles: 0, budget: 2000, fac: 0, bought: [], hist: [], peak: 0, inj: 0, po: null, pend: null, choose: false, retired: false, mates: careerMates(0, new Set()) };
    careerNewSeason(c); c.peak = heroPlayer(c).ovr; P.career = c;
    save(); return go('career');
  }
  if (a === 'cplay') return careerPlay(careerKind(P.career));
  if (a === 'csim') return careerSimLeague();
  if (a === 'cchal') { const c = P.career; if (c.tickets > 0 && !(c.inj > 0)) careerPlay('challenge'); return; }
  if (a === 'ctrain') { const y = window.scrollY; if (heroTrain(P.career, t.dataset.k)) { save(); render(); window.scrollTo(0, y); } return; }
  if (a === 'crole') { const c = P.career; if (c.alt && !c.pend) { c.role = c.role === c.pos0 ? c.alt : c.pos0; save(); render(); } return; }
  if (a === 'cchoose') { const c = P.career; if (c.choose) { c.alt = t.dataset.v; c.choose = false; c.role = c.pos0; save(); go('career'); } return; }
  if (a === 'cend') { if (confirm(T('Karriere wirklich beenden? Dein Spieler geht verloren.'))) { const c = P.career; if (c && c.season_no > 3) retireHero(c); P.career = null; save(); go('start'); } return; }
  if (a === 'cfinish') { const c = P.career; retireHero(c); P.career = null; save(); CN = newCN(); return go('start'); }
  if (a === 'cmf') { CMF = t.dataset.v; return render(); }
  if (a === 'cfac') { const c = P.career, cost = FAC_COST[c.fac], y = window.scrollY; if (cost && c.budget >= cost) { c.budget -= cost; c.fac++; save(); render(); window.scrollTo(0, y); } return; }
  if (a === 'cbuy') {
    const c = P.career, p = BY_ID[t.dataset.id], y = window.scrollY;
    if (!p) return;
    const slot = careerSlotFor(c, p); if (slot < 0) return;
    const old = BY_ID[c.mates[slot]], net = priceOf(p) - Math.round(priceOf(old) * .6);
    if (c.budget < net) return;
    c.budget -= net; c.mates[slot] = p.id; c.bought = c.bought.filter(id => id !== old.id).concat(p.id); save(); render(); window.scrollTo(0, y); return;
  }
  if (a === 'spos') { SF = t.dataset.v; return render(); }
  if (a === 'buydup') {
    const p = BY_ID[t.dataset.id], pr = p && DUP_PRICE[p.tier], y = window.scrollY;
    if (p && P.coll[p.id] && P.money >= pr) { P.money -= pr; P.coll[p.id]++; save(); render(); window.scrollTo(0, y); }
    return;
  }
  if (a === 'buyref') { if (BRIBE_ON && P.money >= REF_PRICE) { P.money -= REF_PRICE; P.ref++; save(); render(); } return; }
  if (a === 'bribe') { if (BRIBE_ON && G && (P.ref > 0 || G.bribe)) { G.bribe = !G.bribe; render(); } return; }
  if (a === 'buy') { const ty = t.dataset.type; if (CRATE_PRICE[ty] && P.money >= CRATE_PRICE[ty]) { P.money -= CRATE_PRICE[ty]; P.packs[ty]++; save(); render(); } return; }
  if (a === 'flip') return flip(i);
  if (a === 'flipnow' && O) { O.cards.forEach((_, k) => flip(k)); return; }
  if (a === 'cpos') { CF.pos = t.dataset.v; return render(); }
  if (a === 'cown') { CF.own = !CF.own; return render(); }
  if (a === 'rpos') { CF.rpos = t.dataset.v; return render(); }
});

// ---- Musik und Einstellungen ----
function syncSettings() {
  const mus = document.getElementById('mus'), vol = document.getElementById('vol'), volv = document.getElementById('volv');
  mus.checked = P.settings.music; vol.value = P.settings.vol; volv.textContent = P.settings.vol + ' %';
  Music.set({ music: P.settings.music, vol: P.settings.vol / 100 });
}
(function () {
  const mus = document.getElementById('mus'), vol = document.getElementById('vol'), volv = document.getElementById('volv');
  syncSettings();
  // Browser erlauben Ton erst nach einer Nutzeraktion: die erste Berührung startet die Musik
  ['click', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (P.settings.music) Music.start(); }, { passive: true }));
  vol.addEventListener('input', () => { P.settings.vol = +vol.value; volv.textContent = vol.value + ' %'; Music.set({ vol: P.settings.vol / 100 }); save(); });
  mus.addEventListener('change', () => { P.settings.music = mus.checked; Music.set({ music: mus.checked }); if (mus.checked) Music.start(); save(); });
})();
restoreRun();
applyStatic();
render();

</script>
